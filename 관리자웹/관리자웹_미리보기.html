:root{--ink:#20332f;--muted:#788883;--teal:#118976;--line:#e3ebe7;--bg:#f5f7f5;--amber:#a46a13}*{box-sizing:border-box}body{margin:0;font:14px 'Noto Sans KR',sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button,a,select{cursor:pointer}button{border:1px solid var(--line);background:white;border-radius:8px;padding:9px 14px;color:var(--ink)}button:hover{border-color:var(--teal);color:var(--teal)}button.primary{background:var(--teal);color:white;border-color:var(--teal)}button:disabled{opacity:.45;cursor:default}aside{position:fixed;width:232px;inset:0 auto 0 0;background:#122f2a;color:white;padding:30px 18px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;font-weight:700;font-size:16px}.brand small{display:block;letter-spacing:1.3px;color:#8bb1a7;font-size:9px;margin-top:6px}.logo{display:grid;place-items:center;background:#b7f0c9;color:#173b31;width:36px;height:40px;border-radius:12px;font-size:24px}.workspace{margin:34px 6px 22px;color:#a6c0b8;font-size:12px}.workspace span{float:right;border:1px solid #466359;padding:1px 6px;border-radius:4px;font-size:10px}nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:#b6cbc4;text-align:left;margin:6px 0;padding:13px 14px}nav button.active{background:#285247;color:white}nav button b{font-size:17px;width:22px}.sidefoot{margin-top:auto;font-size:12px;line-height:2;color:#aac0b9}.sidefoot small{font-size:10px}.sidefoot button{background:none;color:#aac0b9;border-color:#35564b;width:100%;margin-top:15px;font-size:12px}.dot{display:inline-block;width:6px;height:6px;background:#b7f0c9;border-radius:50%;margin-right:4px}.shell{margin-left:232px}header{height:78px;background:white;border-bottom:1px solid var(--line);padding:0 38px;display:flex;align-items:center;justify-content:space-between}select{padding:8px 12px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink);margin-left:12px}.header-rig e:11px;background:#f6f8f6;font-weight:500}td,th{padding:15px 12px;border-bottom:1px solid var(--line)}td{font-size:12px}td small{display:block;font-size:10px;margin-top:4px}.tablewrap{overflow:auto}.link{border:0;padding:0;color:var(--teal);font-weight:600;background:none}.toolbar{display:flex;gap:10px;margin-bottom:18px}.toolbar input{padding:10px 13px;border:1px solid var(--line);border-radius:7px;width:280px}.toolbar select{margin:0}.notice{padding:15px 17px;border-radius:8px;background:#edf5f0;color:#426c59;font-size:12px;line-height:1.8;margin-bottom:20px}.notice.amber{background:#fff6e7;color:#967137}.task{display:flex;gap:14px;padding:17px 0;border-bottom:1px solid var(--line);align-items:center}.task:last-child{border:0}.task .icon{display:grid;place-items:center;width:36px;height:36px;background:#f5eddf;color:#997b42;border-radius:9px}.task div:nth-child(2){flex:1}.task p{font-size:11px;color:var(--muted);margin:5px 0 0}.legend{display:flex;gap:14px;font-size:11px;margin:15px 0;color:var(--muted)}.stockbar{display:flex;height:13px;border-radius:7px;overflow:hidden;background:#eef3ef;margin:16px 0}.stockbar span{display:block}.stockline{display:flex;justify-content:space-between;font-size:12px;margin:12px 0}.timeline{border-left:2px solid #dbe9df;margin:22px 8px;padding-left:24px}.timeline div{position:relative;padding:0 0 24px}.timeline div:before{content:'';position:absolute;left:-30px;top:4px;width:10px;height:10px;border-radius:50%;background:#69ac89}.timeline p{margin:4px 0;color:var(--muted);font-size:11px}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:20px 0}.detailgrid div{background:#f6f8f6;padding:14px;border-radius:7px}.detailgrid small{display:block;margin-bottom:6px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}dialog{border:0;border-radius:15px;width:min(720px,94vw);padding:28px;box-shadow:0 20px 80px #122f2a33;color:var(--ink)}dialog::backdrop{background:#122f2a66}dialog h2{font-size:21px}.modal <body><aside><div class="brand"><span class="logo">B</span><div>공급·재고·물류<small>OPERATIONS CONSOLE</small></div></div><div class="workspace">운영 관리자 <span>DEMO</span></div><nav id="nav"></nav><div class="sidefoot"><span class="dot"></span> 업무 흐름 이해용 시안<br><small>모든 업체·수량·거래는 가상입니다.</small><button id="reset">시연 데이터 초기화 ↺</button></div></aside><div class="shell"><header><div><span class="muted">작업 범위</span><select id="center" aria-label="센터 범위"><option>전체 센터</option><option>DC · 인천</option><option>PPC · 강남</option></select></div><div class="header-right"><span class="live">● 시연 모드</span><button id="help">흐름 안내</button><div class="avatar">운</div></div></header><main id="main"></main><footer>프로젝트 문서 기반 시안 · 실제 B마트·쿠팡 운영 화면이 아닙니다.</footer></div><dialog id="dialog"><div id="modal"></div></dialog><div id="toast" role="status"></div><script>const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const menus=[['home','◈','전체 현황'],['partners','◇','협력업체·상품'],['orders','▤','구매·발주'],['receipts','⇥','입고·검수'],['stock','▦','재고·센터 이관'],['settlement','₩','매입·정산']];
const seed=()=>({partnerApproved:false,orderStage:0,orders:[],inspection:false,transfer:0,paid:false,log:[]});let state;try{state=JSON.parse(localStorage.getItem('supply-admin-demo-v1'))||seed()}catch{state=seed()}let page='home',query='',filter='전체',partnerTab='업체';
function save(msg){state.log.unshift({text:msg,time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})});localStorage.setItem('supply-admin-demo-v1',JSON.stringify(state));render();toast(msg)}function toast(msg){$('#toast').textContent=msg;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3200)}
function go(p){page=p;query='';filter='전체';render();window.scrollTo(0,0)}function pill(s,c=''){return `<span class="pill ${c}">${s}</span>`}function head(k,t,d,action=''){return `<div class="pagehead"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p>${d}</p></div>${action}</div>`}function panel(t,body,sub=''){return `<section class="panel"><div class="panelhead"><h2>${t}</h2><small>${sub}</small></div>${body}</section>`}function table(cols,rows){return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}" class="empty">조건에 맞는 내역이 없습니다.</td></tr>`}</tbody></table></div>`}function metrics(items){return `<div class="metrics">${items.map(([a,b,c])=>`<div class="metric"><label>${a}</label><strong>${b}</strong><small>${c}</small></div>`).join('')}</div>`}function toolbar(statuses){return `<div class="toolbar"><input id="search" aria-label="목록 검색" placeholder="업체·상품·문서번호 검색" value="${esc(query)}"><select id="filter" aria-label="상태 필터">${statuses.map(s=>`<option ${s===filter?'selected':''}>${s}</option>`).join('')}</select></div>`}function match(text,status){return text.toLowerCase().includes(query.toLowerCase())&&(filter==='전체'||filter===status)}function modal(html){$('#modal').innerHTML=`<div class="modalhead"><span class="eyebrow">업무 상세</span><button class="close" aria-label="닫기" onclick="closeModal()">×</button></div>${html}`;$('#dialog').showModal()}function closeModal(){$('#dialog').close()}function doAction(fn,msg){closeModal();fn();save(msg)}
const orderNames=['공급 회신 대기','변경 협의','발주 확정','출하 보고'];function orderStatus(){return orderNames[state.orderStage]||'출하 보고'}
function render(){ $('#nav').innerHTML=menus.map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><b>${i}</b><span>${t}</span></button>`).join('');$('#main').innerHTML=views[page]();if($('#search'))$('#search').oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};if($('#filter'))$('#filter').onchange=e=>{filter=e.target.value;render()};}
const views={home(){const dc=$('#center').value==='DC · 인천',ppc=$('#center').value==='PPC · 강남';return head('OVERVIEW','오늘의 운영 현황','공급부터 정산까지, 지금 확인할 업무를 한눈에 봅니다.',`<button class="primary" onclick="showGuide()">업무 흐름 따라보기 →</button>`)+metrics([['확인할 협력업체',state.partnerApproved?'0':'1','신규 등록·증빙 심사'],['진행 중 발주',String(2+state.orders.length),state.orderStage===1?'부분 공급 회신 · 협의 필요':'발주 응답·납품 진행'],['현물 재고',dc?'8,240':ppc?'2,360':'11,080','이동 중 포함 · 예정 물량 제외'],['검수·정산 확인',state.inspection?'1':'2','파손 판정·매입 인정 분리']])+panel('하나의 거래, 여섯 단계',`<div class="flow">${[['partners','01','협력업체·상품','등록·계약·승인'],['orders','02','구매·발주','수량·납기 합의'],['receipts','03','입고·검수','실물·품질 확인'],['stock','04','재고·이관','DC → PPC 보충'],['settlement','05','매입·정산','인정 수량·지급'],['home','06','운영 현황','지연·차이 추적']].map(([p,n,t,d])=>`<button onclick="${p==='home'?'showGuide()':`go('${p}')`}"><span>STEP ${n}</span><b>${t}</b><small>${d}</small></button>`).join('')}</div>`,'각 단계를 눌러 확인')+`<div class="grid">${panel('우선 확인할 업무',`${!state.partnerApproved?task('◇','그린푸드 · 신규 협력업체 신청','사업자·계좌·계약 상태를 확인하세요.','partners'):''}${state.orderStage<2?task('▤','한빛음료 · 공급 가능 수량 회신','발주 100개, 공급 가능 80개인 시나리오입니다.','orders'):''}${task('⇥','프레시팜 · 파손 5개 검수','출하 100개 / 실입고 100개 / 정상 95개.','receipts')}${task('₩','매입 인정 기준 확인','파손 수량은 계약 확인 후 별도로 판단합니다.','settlement')}`)}${panel('재고 구성',`<div class="stockline"><span>DC · 인천</span><b>8,240개</b></div><div class="stockline"><span>PPC · 강남</span><b>2,360개</b></div><div class="stockline"><span>센터 간 이동 중</span><b>480개</b></div><div class="stockbar"><span style="width:74%;background:#207859"></span><span style="width:21%;background:#88b597"></span><span style="width:5%;background:#dbcba5"></span></div><div class="notice">전체 현물 11,080개<br>할당·격리는 현물의 일부입니다. 별도로 더하지 않습니다.</div><button onclick="go('stock')">센터별 상세 확인 →</button>`)}</div>`+panel('시연 처리 이력',state.log.length?table(['시각','처리 내용'],state.log.slice(0,5).map(l=>[l.time,esc(l.text)])):'<p class="mini">승인·발주·검수 등의 시연을 진행하면 처리 이력이 쌓입니다.</p>')},
partners(){let rows=[['SUP-000001','한빛음료','음료','거래 가능'],['SUP-000002','프레시팜','신선식품','거래 가능'],['SUP-000003','그린푸드','가공식품',state.partnerApproved?'거래 가능':'심사 중']];return head('PARTNERS','협력업체·상품','업체 등록, 계약, 상품 제안을 각각 확인하고 승인합니다.')+`<div class="tabs">${['업체','상품 제안'].map(t=>`<button class="${partnerTab===t?'active':''}" onclick="partnerTab='${t}';render()">${t}</button>`).join('')}</div>`+`<div class="notice">공급사 포털에서 제출한 신청을 내부에서 검토합니다. 업체 등록 승인과 계약 체결, 상품 거래 승인은 별도입니다.</div>`+panel(partnerTab==='업체'?'협력업체 목록':'상품 제안 목록',toolbar(['전체','거래 가능','심사 중'])+(partnerTab==='업체'?table(['업체코드','협력업체','취급상품','계약','상태',''],rows.filter(r=>match(r.join(' '),r[3])).map(r=>[r[0],`<b>${r[1]}</b><small>공급사 포털 연결</small>`,r[2],r[3]==='심사 중'?'검토 중':'체결',pill(r[3],r[3]==='심사 중'?'amber':'green'),`<button onclick="partnerDetail('${r[1]}')">상세 보기</button>`])):table(['신청번호','상품','협력업체','구매단위','상태',''],match('그린푸드 귀리 스낵','심사 중')?[['상품 제안 003','귀리 스낵 40g','그린푸드','1박스 / 24개',pill('심사 중','amber'),`<button onclick="productDetail()">제안 검토</button>`]]:[])))},
orders(){const rows=[{id:'PO-20261012-000001',name:'한빛음료',item:'탄산수 500ml',qty:100,status:orderStatus()},{id:'PO-20261012-000002',name:'프레시팜',item:'샐러드 키트',qty:100,status:'입고·검수'},...state.orders];return head('PURCHASE','구매·발주','필요 수량을 발주하고, 공급사의 회신과 납품 실적을 연결합니다.',`<button class="primary" onclick="newOrder()">＋ 발주 초안</button>`)+metrics([['진행 발주',String(rows.length),'공급사별 PO 관리'],['회신 가능 수량',state.orderStage?'80개':'확인 중','한빛음료 · 요청 100개'],['미해결 잔량',state.orderStage===1?'20개':'—','변경·취소·이월 협의'],['납품센터','DC 인천','센터 간 이동과 공급사 발주 구분']])+panel('발주 목록',toolbar(['전체',...orderNames,'입고·검수','초안'])+table(['발주번호','협력업체·상품','요청 수량','납품센터','상태',''],rows.filter(r=>match(r.id+r.name+r.item,r.status)).map((r,i)=>[r.id,`<b>${esc(r.name)}</b><small>${esc(r.item)}</small>`,`${r.qty}개`,'DC · 인천',pill(r.status,r.status==='변경 협의'?'amber':'blue'),`<button onclick="${r.id.endsWith('000001')?'orderDetail()':r.id.endsWith('000002')?"go('receipts')":`draftDetail('${r.id}')`}">상세 보기</button>`])))+`<div class="notice">공급 가능 80개 회신만으로 원발주 100개가 자동 변경되지는 않습니다. 협의 결과를 기록한 뒤 변경·잔량 취소를 적용합니다.</div>`},
receipts(){return head('INBOUND','입고·검수','공급사의 출하 보고와 센터의 실제 입고·품질 결과를 대조합니다.')+metrics([['출하 보고','100개','프레시팜 ASN'],['센터 실입고','100개','센터 작업자 계수'],['정상 / 파손','95 / 5','수량 부족과 파손 구분'],['결과 상태',state.inspection?'확정':'검토 중','매입 인정은 계약에 따라 별도 판단']])+panel('공급사 입고',table(['입고 문서','상품·협력업체','예정 / 실입고','검수','상태',''],[['RCV-20261012-000001','샐러드 키트<small>프레시팜 · ASN-20261012-000001</small>','100 / 100개','정상 95 · 파손 5',pill(state.inspection?'결과 확정':'차이 검토',state.inspection?'green':'amber'),`<button onclick="receiptDetail()">검수 결과</button>`],...(state.orderStage===3?[['입고 예정','탄산수 500ml<small>한빛음료 · ASN-20261012-000002</small>','80 / 미도착','대기',pill('도착 대기','blue'),'<span class="mini">출하 보고는 재고 미반영</span>']]:[])]))+panel('문제 발생 시 처리',table(['상황','즉시 처리','확인 후 다음 단계'],[['출하 100 · 실입고 98','출하·실입고 수량 각각 보존','증빙 확인 · 차이 2개 조사'],['실입고 100 · 파손 5','파손 실물 구분·증빙 기록','반품·재납품·매입 인정은 계약 확인'],['검수 결과 이의 제기','원결과 보존 · 문서별 문의','재검토·정정 이력 연결']]))},
stock(){const scope=$('#center').value;const rows=[['DC · 인천','8,240','7,600','420','220'],['PPC · 강남','2,360','1,900','380','80']].filter(r=>scope==='전체 센터'||r[0]===scope);return head('INVENTORY','재고·센터 이관','센터 보유량과 이동 중 물량을 구분하고 DC에서 PPC로 보충합니다.')+panel('센터별 현물',table(['센터','현물','가용','할당','격리'],rows))+`<div class="notice">가용·할당·격리는 현물의 구성입니다. 입고 예정 1,200개는 현물에 합산하지 않습니다. 이 표는 상태를 배타적으로 나눈 시연 예시입니다.</div>`+panel('DC → PPC 보충',table(['이관번호','경로','출발 / 도착 / 잔량','상태',''],[['TRF-20261012-000001','DC 인천 → PPC 강남','12 / 10 / 2개',pill(state.transfer?'잔량 조사 중':'부분 도착','amber'),`<button onclick="transferDetail()">이관 상세</button>`]]))+panel('예약 주문과 재고',`<div class="detailgrid"><div><small>현재 현물</small><b>센터에 실제 있는 상품</b><p class="mini">즉시 출고 시 실제 가용 물량 확인</p></div><div><small>확정 입고 예정</small><b>아직 도착하지 않은 물량</b><p class="mini">예약 판매 약속에 활용 가능 · 현물과 분리</p></div></div><p class="mini">센터 간 도착은 TIN으로 기록합니다. 공급사 매입용 RCV·PUR를 중복 생성하지 않습니다.</p>`)},
settlement(){return head('FINANCE','매입·정산','발주·입고·계약을 대조해 인정 수량과 지급 내역을 확인합니다.')+metrics([['입고 확인','100개','프레시팜 · 샐러드 키트'],['매입 인정','미확정','파손 5개 계약 검토 필요'],['지급 예정','₩480,000','한빛음료 · 별도 완료 거래'],['지급 상태',state.paid?'지급 완료':'지급 대기','지급 결과 기록 시연']])+panel('정산 목록',table(['협력업체','문서·대상','인정 수량 / 금액','상태',''],[['프레시팜','RCV-20261012-000001<small>샐러드 키트 · 정상 95 / 파손 5</small>','계약 검토 필요',pill('매입 검토','amber'),`<button onclick="financeDetail()">근거 확인</button>`],['한빛음료','PUR-20261011-000001<small>전일 입고 완료 거래 · 현재 발주와 별개</small>','240개 / ₩480,000',pill(state.paid?'지급 완료':'지급 대기',state.paid?'green':'blue'),`<button onclick="paymentDetail()">지급 상세</button>`]]))+`<div class="notice amber">파손을 자동으로 매입 제외하거나 정상 입고량을 곧바로 정산 수량으로 확정하지 않습니다. 계약·검수·반품 결과를 함께 확인합니다.</div>`}};

</script><script>window.projectDocs={"00_DC_PPC_구역_위치번호_운영웹.md":"# DC(중앙 물류센터)·PPC(피킹·포장센터) 구역·위치번호·운영 웹 설계안\n\n## 1. 정의·적용 범위\n- DC(중앙 물류센터): 공급사 상품 입고·대량 보관·PPC(피킹·포장센터) 보충 출고를 담당하는 중앙 거점.\n- PPC(피킹·포장센터): DC(중앙 물류센터) 보충 물량 입고·보관·고객 주문 피킹·포장·라이더 인계 거점.\n- 두 센터 모두 재고 보유. PPC(피킹·포장센터)를 통과형 TC로 정의하지 않음. (재고 보관은 필요. 별도 예비보관실·B구역 물리 분리는 규모에 따라 선택.)\n- 아래 A~H 구역·번호 형식은 본 프로젝트 설계안. 실제 B마트 내부 구역명·코드로 확인된 내용이 아님.\n- 구역은 업무 구분. 실제 층·방·벽의 개수와 동일하지 않음.\n- 실제 평면·설비·작업량 확인 후 배치·면적 확정. 아래 흐름도는 업무 순서도.\n\n## 2. DC(중앙 물류센터) 와 PPC(피킹·포장센터) 개념\n| 구분 | **DC(중앙 물류센터) — 중앙 메가 물류센터** | **PPC(피킹·포장센터) — 도심형 주문 처리 거점** |\n|---|---|---|\n| 역할 | 공급사 상품을 받아 보관하고 지역 거점에 공급 | 고객 가까이에서 주문 상품을 준비 |\n| 주요 입고 | 공급사 납품 | DC(중앙 물류센터)에서 보낸 보충 물량 |\n| 주요 작업 | 입고 검수·분류·보관·재고관리·센터 이관 | 입고 검수·적치·재고 배치·피킹·포장 |\n| 출고 대상 | PPC(피킹·포장센터) 등 다른 센터 | 고객 주문에 배정된 라이더 |\n| 출고 기준 | 센터 보충·이관 요청 | 고객 주문·예약시간 |\n| 재고 보유 | 보유 | 보유. 판매가능 재고로 관리 |\n\n이런 구조에 따르는 이점은 다음과 같다.\n\n1. DC(중앙 물류센터)에 통합 납품하는 것이 PPC(피킹·포장센터)에 개별 납품하는 것보다 공급사의 부담이 적다. \n\n2. 공간 압축적. 모든 센터를 대규모로 설계할 필요 없고, 중앙 물류센터(DC(중앙 물류센터)) 체계를 두고 각 PPC(피킹·포장센터)에 수요에 맞춰 공급.\n\n3. DC(중앙 물류센터)는 박스 위주, PPC(피킹·포장센터)는 낱개 위주로 업무하며 피킹시설 전문화.\n\n4. 중앙공급체계에서 PPC(피킹·포장센터)로 뻗어나가는 병렬구조는 PPC(피킹·포장센터) 거점을 늘리는 데에 용이함.\n\n5. 재고 배분 유용성, 굳이 공급업체의 납품을 기다리지 않더라도. DC(중앙 물류센터)에서 수요 높은 PPC(피킹·포장센터)에 추가 물량 보충 가능.\n\n6. 고객의 주문전 예상 수요만큼 PPC(피킹·포장센터)에 미리 배치해둠으로서 운송시간 단축.\n\n\n## 3. 근거\n| 근거 | 확인 내용 | 설계 반영 |\n|---|---|---|\n| 제공 자료 `00_전체서비스_이해/2.png` | 중앙 DC(중앙 물류센터) → 도심형 PPC(피킹·포장센터)·MFC(소형 물류센터) → 고객·라이더 | 센터 역할 분리 |\n| 제공 자료 `00_전체서비스_이해/3.png` | DC(중앙 물류센터) 할당·집품·상차 → 운송 → PPC(피킹·포장센터) 검수·적치 | DC(중앙 물류센터) 출하 대기·상차, PPC(피킹·포장센터) 입고·판매 준비 구분 |\n| 제공 자료 `03_공급_재고_물류/11.png`, `12.png` | 입고장·보관선반·피킹선반·센터 이동 | 내부 이동과 센터 이송 구분 |\n| [Microsoft WMS 위치 설정](https://learn.microsoft.com/en-us/dynamics365/supply-chain/warehousing/tasks/configure-locations-wms-enabled-warehouse) | 구역·위치 유형·통로/랙/단/칸 구성, 용량·혼재·실사 설정 지원 | 계층형 위치주소·별도 위치 속성 사용 |\n| [쿠팡 WMS 운영 사례](https://news.coupang.com/archives/18754/) | WMS(창고·재고 관리) 기반 물류 운영·랜덤스토우 설명 | 동일 상품을 한 위치에만 고정하지 않음 |\n| [쿠팡 현장 입고·적치 사례](https://news.coupang.com/archives/10996/) | 입고·집품과 랜덤스토우 현장 소개 | 상품·위치 스캔 기반 적치 추적 |\n\n- 사례는 공간·재고 관리 방식의 참고. 타사의 구역 문자·규모·정책을 그대로 적용하지 않음.\n- Microsoft 예제의 특정 제품 코드 길이 제한은 본 프로젝트 코드 길이 제한으로 적용하지 않음.\n- 기존 문서번호는 [ERP·WMS 업무 문서 채번 지침](00_ERP·WMS%20업무%20문서%20채번%20지침.md) 유지.\n\n## 4. 공통 구역 사전\n| 구역 | 이름 | 공통 의미 |\n|---|---|---|\n| A | 입고·검수 | 도착·하차·검수·적치 대기 |\n| B | 보관 | 정상 재고의 예비·대량 보관 |\n| C | 집품·피킹 | 출고 대상 상품 집품 |\n| D | 출하 준비 | 검품·포장·라벨·출하 단위 구성 |\n| E | 출하 대기 | 준비 완료 상품·포장의 대기 |\n| F | 상차·인계 | 차량 상차 또는 라이더 전달 |\n| G | 품질 격리 | 파손·기한·품질 의심·회수 검토 |\n| H | 반품·폐기 대기 | 처분 방식 결정 후 실행 대기 |\n\n- 실사·보충은 업무 종류. 전용 물리 구역을 필수로 만들지 않음.\n- 사무실·충전·휴게 공간은 시설정보 관리. 재고 적치 위치로 사용하지 않음.\n- G·H는 정상 판매 동선과 구분. 격리·처분 대기도 필요한 보관온도 유지.\n\n## 5. DC(중앙 물류센터) 구역 구성\n| 구역 | 세부 구역 예 | 업무·입출력 | 다음 단계·조건 |\n|---|---|---|---|\n| A | A01 하차 / A02 검수 / A03 적치대기 | 공급사 도착·RCV(입고·검수) 검수·Lot 확인 | 정상 B, 이상 G |\n| B | B01 상온 / B02 냉장 / B03 냉동 | 박스·팔레트 예비 재고 보관 | PPC(피킹·포장센터) 보충요청에 따라 C |\n| C | C01 상온집품 / C02 냉장집품 / C03 냉동집품 | PPC(피킹·포장센터)별 할당·집품 | 품목·로트·수량 확인 후 D |\n| D | D01 검품 / D02 출하구성 | PPC(피킹·포장센터) 목적지별 검품·운송단위 구성 | 목적지·수량 확인 후 E |\n| E | E01 상온 / E02 냉장 / E03 냉동 | 노선·도착센터별 상차 대기 | 배차·보관조건 확인 후 F |\n| F | F01 도크 / F02 도크 | 차량·이송·상차 확인 | TOUT(이송 출발) 확정·이동중 반영 |\n| G | G01 상온 / G02 냉장 / G03 냉동 | 격리·재검수 | 해제 B 또는 처분 H |\n| H | H01 반품 / H02 폐기 | RTV(공급사 반품)·DSP(폐기) 대상 실행 대기 | 실제 반출·폐기 확인 후 차감 |\n\n- C 집품은 PPC(피킹·포장센터) 공급 목적. 고객 토트 피킹과 구분.\n- 작은 DC(중앙 물류센터)는 B에서 직접 집품 가능. C 전용 선반 없이도 집품 작업은 유지.\n- DC(중앙 물류센터) 고객 주문 처리·기사 인계는 현재 기본 범위 아님. 필요 시 별도 기능 활성화.\n\n```text\n공급사 → A 입고·검수 → B 보관 → C PPC(피킹·포장센터)별 집품 → D 출하 준비 → E 대기 → F 상차\n              └─ 이상 → G 격리 → 재검수 적합: B / 처분 결정: H\n```\n\n## 6. PPC(피킹·포장센터) 구역 구성\n| 구역 | 세부 구역 예 | 업무·입출력 | 다음 단계·조건 |\n|---|---|---|---|\n| A | A01 도착 / A02 검수 / A03 적치대기 | DC(중앙 물류센터) 물량 도착·TIN(이송 도착)·품질 확인 | 정상 B 또는 C, 이상 G |\n| B | B01 상온 / B02 냉장 / B03 냉동 | 피킹선반 보충용 예비 재고 | MOV(센터 내부 이동·적치·보충) 보충으로 C |\n| C | C01 상온 / C02 냉장 / C03 냉동 | 고객 주문별 낱개 피킹 | ORD(고객 주문)·TSK(작업 식별자)·TOTE(재사용 운반 용기) 확인 후 D |\n| D | D01 검품 / D02 포장 | 주문 검품·온도별 포장·PKG(실물 포장 식별자) 라벨 | 전체 포장 확인 후 E |\n| E | E01 상온 / E02 냉장 / E03 냉동 | 바로배달·예약 주문 대기 | 보관시간·온도·배차 확인 후 F |\n| F | F01 인계대 / F02 인계대 | 기사·SHP(출하)·유효 PKG(실물 포장 식별자) 확인 | 전체 전달·HOV(기사 인계) 완료 |\n| G | G01 상온 / G02 냉장 / G03 냉동 | 파손·결품 조사·품질 회수 검토 | 해제 B/C 또는 처분 H |\n| H | H01 반품 / H02 폐기 | 확정된 처분 실행 대기 | RTV(공급사 반품)·DSP(폐기) 실제 결과 반영 |\n\n- 공간이 작으면 B 예비재고 구역은 선택. 입고 후 C 직접 적치 가능.\n- E의 예약·즉시 구분은 주문 속성 또는 별도 대기칸으로 관리.\n- F 인계대는 장기 보관장소 아님. E에서 필요한 보관조건 유지.\n- 센터 간 이송 입고는 TIN(이송 도착) 기준. 공급사 직접 납품이 허용된 경우만 RCV(입고·검수) 사용.\n- DC(중앙 물류센터)→PPC(피킹·포장센터) 이송 도착만으로 새 매입 PUR(매입확정)를 생성하지 않음.\n\n```text\nDC(중앙 물류센터) → A 도착·검수 → B 예비재고 → C 주문 피킹 → D 포장 → E 온도별 대기 → F 기사 인계\n                    └─ 직접 C 적치 가능\n이상 → G 격리 → 적합: B/C / 반품·폐기 결정: H\n```\n\n## 7. 센터·구역·위치 코드\n\n### 7.1 센터 코드\n`센터유형-지역코드-센터순번2자리`\n\n| 예시 | 의미 |\n|---|---|\n| DC-IC-01 | 인천 지역 DC(중앙 물류센터) 1번 — 설명용 예시 |\n| PPC-GN-01 | 강남 지역 PPC(피킹·포장센터) 1번 |\n| PPC-GN-02 | 강남 지역 PPC(피킹·포장센터) 2번 |\n\n- 지역코드는 중앙 코드표에서 유일하게 관리. 위 지역 매핑은 설계 예시.\n- 순번은 센터유형·지역별 01부터. 폐쇄된 코드 재사용 금지.\n- 99개 초과 시 자리수 정책 확장. 기존 코드 일괄 변경 금지.\n- 센터 내부 고유 ID 별도 보유. 명칭·주소 변경은 이력 관리.\n\n### 7.2 구역 코드\n`센터코드-업무구역문자+세부번호2자리`\n\n- `PPC-GN-01-A02`: 강남 PPC(피킹·포장센터) 1번의 검수구역.\n- `DC-IC-01-B02`: 인천 DC(중앙 물류센터) 1번의 냉장 보관구역.\n- 세부번호는 센터·업무구역별 등록. 공통 템플릿과 실제 운영 매핑 보존.\n- 같은 B02라도 온도는 반드시 속성으로 검증. 코드만 보고 추정 금지.\n\n### 7.3 선반 위치 코드\n`센터코드-구역코드-F층2자리-L통로2자리-R랙3자리-S단2자리-B칸2자리`\n\n예: `PPC-GN-01-C02-F01-L03-R007-S02-B04`\n\n| 요소 | 값 | 의미 |\n|---|---|---|\n| 센터 | PPC-GN-01 | 강남 PPC(피킹·포장센터) 1번 |\n| 구역 | C02 | 냉장 피킹구역으로 등록된 구역 |\n| 층 | F01 | 1층 |\n| 통로 | L03 | 3번 통로 |\n| 랙 | R007 | 해당 층·구역·통로의 7번 랙 |\n| 단 | S02 | 아래에서 두 번째 선반 |\n| 칸 | B04 | 해당 선반의 네 번째 칸 |\n\n- 방향 기준: 평면도에 통로 시작점·랙 정면 지정. 랙 정면에서 좌→우 칸 증가, 단은 아래→위 증가.\n- 통로·랙의 번호는 승인된 배치도 기준. 현장에서 임의 순번 발급 금지.\n- 새 통로·랙 추가 시 빈 번호 사용. 기존 위치 번호 재정렬 금지.\n- 사용하지 않는 번호를 억지로 채우지 않음.\n- 상품·Lot·수량·온도·상태는 번호에 넣지 않음.\n- 위치는 공간 주소. 보관상품 변경만으로 번호 변경 금지.\n\n### 7.4 바닥·작업대·도크 위치\n선반 구조가 없는 곳은 가짜 단·칸 번호를 만들지 않음.\n\n`센터코드-구역코드-F층2자리-위치유형+순번3자리`\n\n| 유형 | 용도 | 예시 |\n|---|---|---|\n| FL | 바닥·팔레트 구획 | DC-IC-01-A01-F01-FL001 |\n| TB | 검수·포장·인계 작업대 | PPC-GN-01-D02-F01-TB003 |\n| DK | 상하차 도크 | DC-IC-01-F01-F01-DK002 |\n| ST | 출하 대기칸 | PPC-GN-01-E02-F01-ST005 |\n\n- 순번은 센터·구역·층·위치유형별 001부터.\n- 냉장 대기칸 ST는 실제 냉장 설비·수용량 확인 후 등록.\n- 화면에는 짧은 표시명 제공 가능. 스캔은 전체 코드 또는 내부 location_id로 검증.\n- 위치 바코드에는 상품 바코드와 구별되는 위치 식별값 사용.\n- TOTE(재사용 운반 용기)·PKG(실물 포장 식별자)·차량·작업자는 위치코드가 아님. 위치와 점유·사용 관계로 연결.\n\n## 8. 업무 일련번호 — 기존 규칙 유지\n| 대상 | 번호 | 적용 |\n|---|---|---|\n| 공급사 입고 | RCV-20261012-000001 | 최초 도착·검수 저장 |\n| 내부 이동 | MOV-20261012-000001 | A→B·B→C 등 이동 지시 |\n| 센터 이송 | TRF-20261012-000001 | DC(중앙 물류센터)→PPC(피킹·포장센터) 지시 |\n| 이송 출발·도착 | TOUT(이송 출발) / TIN(이송 도착) | 출발 건·실제 도착 건별 |\n| 출하·기사 인계 | SHP(출하) / HOV(기사 인계) | 고객 출하·인계 단위 |\n| 작업·포장 | TSK(작업 식별자) / PKG(실물 포장 식별자) | 작업·실물 포장별 식별 |\n\n- 문서유형·한국시간 생성일별 6자리 순번. DC(중앙 물류센터)·PPC(피킹·포장센터) 포함 전체 센터 공통.\n- DC(중앙 물류센터)에서 MOV(센터 내부 이동·적치·보충) 000001 발급 후 PPC(피킹·포장센터)에서 같은 날 다음 MOV(센터 내부 이동·적치·보충) 발급 시 000002.\n- 센터별 000001 재시작 금지. 센터·출발·도착 위치는 별도 참조 항목.\n- 위치번호의 숫자는 공간 식별값. 날짜별 초기화 금지.\n- 동일 요청 ID 재전송은 기존 문서 반환. 실제 새 이동·도착은 새 문서.\n- 일일 999999 초과 시 발급 실패·관리자 알림. 자동 순환·중복 발급 금지. 자리수 확장은 별도 버전 정책.\n\n## 9. 위치 마스터·통제\n| 속성 | 내용 |\n|---|---|\n| 식별 | location_id, 전체 코드, 표시명, 센터·구역·층 |\n| 구조 | 통로·랙·단·칸 또는 바닥·작업대·대기칸 |\n| 역할 | 입고·보관·피킹·포장·대기·인계·격리·처분 |\n| 보관 | 허용 온도·상품군·중량·부피·수량 |\n| 정책 | 상품·Lot 혼재 여부, 피킹 허용, 입출고 잠금 |\n| 운영 | 사용중·중지·폐쇄, 실사 잠금, 적용기간·변경 이력 |\n\n- 역할·온도·용량 변경은 재고·진행 작업 영향 검토 후 적용.\n- 격리 위치 이동과 재고 격리 상태 전환을 함께 확인. 위치만 바꿔 품질 상태 누락 금지.\n- 정상 구역으로 옮겼다고 자동 격리 해제 금지.\n- 실물 위치 변경 시 실제 이동 반영. 마스터 이름 변경으로 재고 이동 대체 금지.\n- 선반 재배치로 실제 주소가 바뀌면 새 위치 등록·MOV(센터 내부 이동·적치·보충) 이관·기존 위치 폐쇄.\n- 단순 라벨 재출력은 기존 위치번호 유지·출력 이력.\n- 위치 폐쇄는 재고 0·진행 작업 없음 확인 후 수행.\n\n## 10. 오류 대응\n| 문제 | 즉시 처리 | 후속 조건 |\n|---|---|---|\n| 다른 센터 위치 스캔 | 내부 MOV(센터 내부 이동·적치·보충) 확정 차단 | 센터 이송 TRF(센터 간 이송) 필요 여부 확인 |\n| 온도·중량·부피 불일치 | 적치 차단 | 적합 위치 재배정 |\n| 위치 용량 부족 | 실제 초과 적치 금지 | 분할 MOV(센터 내부 이동·적치·보충)·적합 위치 확인 |\n| 격리·폐기대기 재고 피킹 | 차단 | 품질 판정·상태 확인 |\n| 위치 잠금 | 신규 작업 제한 | 관리자 확인·잠금 해제 |\n| 부분 도착 | TIN(이송 도착) 실제 수량만 반영 | 미도착은 이동중·조사 |\n| 스캔 응답 없음 | 처리 결과 조회 | 같은 요청 ID 재전송 |\n| 위치 라벨 손상 | 임의 위치 확정 금지 | 권한자 확인·기존 코드 재출력 |\n\n## 11. 운영 웹·권한\n- 공통 운영 웹 1개. DC(중앙 물류센터)·PPC(피킹·포장센터)별 대시보드·작업 메뉴 제공.\n- 동일 시스템의 재고·Lot·실사·품질·이송 규칙 공유.\n- PDA(현장 작업 단말)는 스캔 중심 별도 화면. 공급사·고객·기사는 목적별 화면 제공.\n- 권한 = 접근센터 × 직무 × 행위 × 배정작업 × 승인조건.\n- ID 접두어로 권한 판단 금지. 계정에 권한 속성 연결.\n\n| 사용자 | 기본 메뉴 | 데이터·행위 범위 |\n|---|---|---|\n| DC(중앙 물류센터) 운영 | 공급사 입고·보관·이송·상차 | 허용 DC(중앙 물류센터)·관련 이송 |\n| PPC(피킹·포장센터) 운영 | 이송 입고·재고·주문·피킹·인계 | 허용 PPC(피킹·포장센터)·관련 주문 |\n| 본사 운영 | 전체 관제·센터별 예외 | 승인된 복수/전체 센터 |\n| 품질 담당 | 격리·재검수·처분 | 승인된 센터·품질행위 |\n| 현장 작업자 | 내 작업·스캔·문제보고 | 당일 직무·배정 작업 |\n\n- 센터 변경 시 접근권한·직무 다시 확인.\n- 메뉴 숨김과 별개로 서버가 모든 요청의 센터·문서·행위 권한 검증.\n- 양센터 이송 담당자는 필요한 상대센터·이송정보만 조회. 상대센터 전체 권한 자동 부여 금지.\n- 요청자·승인자·실행자 기록.\n- 분리 웹은 독립 운영조직·배포·보안 요구가 생길 때 검토. 별도 웹이어도 문서·재고 연결 규칙 유지.\n- 근거: 프로젝트 공통 업무·TRF(센터 간 이송) 연결 구조에 따른 설계 판단. 권한 검증은 [OWASP 지침](https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html) 참고.\n\n## 12. 기존 위치코드와 전환\n- 기존 `PPC-GN-01-A03-02-01`은 구역·층·통로가 분명하지 않은 이전 예시.\n- 새 등록 위치에는 본 문서 형식 적용.\n- 기존 데이터가 있다면 문자열로 자동 해석하지 않음. 배치도·현장 확인 후 새 location_id와 매핑.\n- 기존 코드는 외부/이전 참조코드로 보존. 기존 거래 이력의 번호 일괄 변경 금지.\n- 구·신 라벨 동시 운영 시 양쪽이 동일 위치 ID로 해석되도록 유일 매핑 검증.\n- 기존 문서 채번·Lot·실사 정책은 유지. 본 문서는 위치 기준정보 확장안.\n\n## 13. 적용 순서\n1. DC(중앙 물류센터)·PPC(피킹·포장센터) 센터 마스터 등록.\n2. 실제 평면·온도 설비·입출고량 조사.\n3. A~H 중 사용 구역 선택·세부 구역 등록.\n4. 층·통로·랙·단·칸 또는 작업대·바닥 위치 등록.\n5. 용량·혼재·피킹·보관·격리 정책 입력.\n6. 위치 라벨 발급·현장 스캔 검증.\n7. 센터·직무·행위 권한 설정.\n8. 입고→적치→이송→피킹→포장→인계 시나리오 검증.\n9. 기존 위치 매핑·전환 승인 후 적용.\n\n## 공개 확인과 구역 제안\n- DC(중앙 물류센터)·PPC(피킹·포장센터) 역할·목포 동선·품질 사례는 공개 확인. A~H 문자·코드·물리 구획은 프로젝트 제안.\n- MFC(소형 물류센터)는 일반 소형 거점 개념. PPC(피킹·포장센터)와 동일한 내부 운영 코드로 사용하지 않음.\n- 무겁거나 고빈도인 상품의 패킹 근접 배치를 PPC(피킹·포장센터) 설계에 반영. 냉장 수축산 지정 위치는 상품 조건별 관리.\n- 공통 웹은 프로젝트 선택. 센터별 독립 처리가 사이트 분리를 뜻하는 것은 아님.\n\n## 실제 운영 조사 보충\n- [쿠팡·B마트 미정 정책 27개 비교 조사](14_미정정책_쿠팡_B마트_실사례조사.md). 공개 확인과 프로젝트 제안을 구분.\n","00_ERP·WMS 업무 문서 채번 지침.md":"### ERP(전사 업무 관리)·WMS(창고·재고 관리) 업무 문서 채번 지침\r\n\r\n1. 기본 형식\r\n\r\n업무 문서번호는 다음 형식으로 통일한다.\r\n\r\n`문서유형-YYYYMMDD-일련번호 6자리`\r\n\r\n예: `PO-20261012-000001`\r\n\r\n- 문서유형: 업무 종류를 구분하는 접두어\r\n- 날짜: 한국시간 기준 최초 문서 생성일\r\n- 일련번호: 문서유형·날짜별로 000001부터 증가\r\n- 번호 부여 범위: 프로젝트 전체 센터 공통\r\n\r\n센터·공급사·상품·수량·상태는 문서번호에 넣지 않고 별도 항목으로 관리한다.\r\n\r\n2. 문서 종류\r\n\r\n| 업무 | 접두어 | 문서번호 예시 | 생성 기준 |\r\n|---|---|---|---|\r\n| 구매발주 | PO(구매발주) | PO-20261012-000001 | 발주 초안 최초 저장 |\r\n| 공급사 납품예정 | ASN(공급사 납품예정) | ASN-20261012-000001 | 납품예정 최초 저장 |\r\n| 발주 변경 요청 | PCH(발주 변경 요청) | PCH-20261012-000001 | 수량·납기 등 변경 요청 |\r\n| 발주 잔량 취소 | PCN(발주 잔량 취소) | PCN-20261012-000001 | 잔량 취소 요청 |\r\n| 입고·검수 전표 | RCV(입고·검수) | RCV-20261012-000001 | 도착·검수 건 최초 저장 |\r\n| 공급사 반품 | RTV(공급사 반품) | RTV-20261012-000001 | 반품 건 최초 저장 |\r\n| 매입확정 전표 | PUR(매입확정) | PUR-20261012-000001 | 매입 인정 건 최초 저장 |\r\n| 매입 조정 전표 | PJA(매입 조정) | PJA-20261012-000001 | 확정 후 차감·추가 조정 |\r\n| 적치·보충·센터 내부 이동 | MOV(센터 내부 이동·적치·보충) | MOV-20261012-000001 | 위치 이동 지시 생성 |\r\n| 센터 간 이송 | TRF(센터 간 이송) | TRF-20261012-000001 | 센터 이송 지시 생성 |\r\n| 이송 출발 전표 | TOUT(이송 출발) | TOUT-20261012-000001 | 이송 출발 건 생성 |\r\n| 이송 도착 전표 | TIN(이송 도착) | TIN-20261012-000001 | 이송 도착 건 생성 |\r\n| 품질 격리 | QLT(품질 격리) | QLT-20261012-000001 | 격리 건 등록 |\r\n| 폐기 | DSP(폐기) | DSP-20261012-000001 | 폐기 요청 생성 |\r\n| 재고 실사 | CNT(재고 실사) | CNT-20261012-000001 | 실사 문서 생성 |\r\n| 재고 조정 | ADJ(재고 조정) | ADJ-20261012-000001 | 조정 요청 생성 |\r\n| 고객 주문 | ORD(고객 주문) | ORD-20261012-000001 | 주문 최초 저장 |\r\n| 결품·대체 처리 | EXC(결품·대체 처리) | EXC-20261012-000001 | 고객 결정이 필요한 건 생성 |\r\n| 고객 주문 취소 | OCN(고객 주문 취소) | OCN-20261012-000001 | 전체·부분 취소 요청 |\r\n| 출하 | SHP(출하) | SHP-20261012-000001 | 고객 출하 단위 생성 |\r\n| 기사 인계 | HOV(기사 인계) | HOV-20261012-000001 | 출하 인계 건 생성 |\r\n| 환불 | RFD(환불) | RFD-20261012-000001 | 환불 요청 생성 |\r\n\r\n문서번호가 부여됐다는 것은 문서가 생성됐다는 뜻이다. 승인·확정·완료 여부는 상태로 판단한다.\r\n\r\n폐기 요청·승인·실행은 같은 DSP(폐기) 문서에 기록한다. 입고 검수와 확정도 같은 RCV(입고·검수) 문서의 상태·이력으로 관리한다. 모든 상태 변경마다 새 문서번호를 만들지 않는다.\r\n\r\n3. 문서번호와 다른 식별자\r\n\r\n| 대상 | 형식 예시 | 관리 방법 |\r\n|---|---|---|\r\n| 작업 | TSK-20261012-000001 | 작업별 번호, 교대 후에도 유지 |\r\n| 포장 | PKG-20261012-000001 | 실물 포장별 고유 번호 |\r\n| 공급사 | SUP-000001 | 기준정보 코드 |\r\n| 센터 | PPC-GN-01 | 센터 기준정보 코드 |\r\n| 위치 | PPC-GN-01-A03-02-01 | 센터·선반·단·칸 기준 코드 |\r\n| 토트 | TOTE-000077 | 재사용 용기 코드 |\r\n| 상품 | SKU-000001 | 상품 기준정보 코드 |\r\n| Lot | 내부 고유 ID + 공급사 Lot값 | 공급사 Lot값만으로 전사 유일성을 판단하지 않음 |\r\n| 스캔·재전송 요청 | UUID(중복 방지용 고유 요청번호) 등 고유 ID | 단말에서 건별 생성, 재전송 시 유지 |\r\n\r\n토트는 여러 주문에 순차적으로 재사용할 수 있으므로 주문과 연결한 사용 이력을 남긴다.\r\n\r\n포장 라벨의 ‘1/3’은 표시 순번이며 고유 식별자가 아니다. 인계 검증은 PKG(실물 포장 식별자) 번호로 수행한다.\r\n\r\n4. 발주·입고 연결 규칙\r\n\r\n발주 한 건에 여러 납품예정과 입고 전표를 연결할 수 있다. 문서번호 자체에 상위 발주번호를 넣지 않고 연결 항목으로 저장한다.\r\n\r\n예:\r\n\r\n| 문서 | 수량 | 연결 |\r\n|---|---:|---|\r\n| PO-20261012-000001 | 90병 | 원발주 |\r\n| ASN-20261012-000001 | 60병 | 해당 PO(구매발주)의 상품행 |\r\n| ASN-20261012-000002 | 30병 | 해당 PO(구매발주)의 상품행 |\r\n| RCV-20261013-000001 | 60병 | 첫 ASN(공급사 납품예정) 및 PO(구매발주) 상품행 |\r\n| RCV-20261015-000001 | 30병 | 두 번째 ASN(공급사 납품예정) 및 PO(구매발주) 상품행 |\r\n\r\n문서 안의 상품행은 내부 고유 행 ID와 표시 행번호를 갖는다. 입고·취소·반품·매입은 문서뿐 아니라 대상 상품행까지 연결한다.\r\n\r\n5. 변경·이월·취소 규칙\r\n\r\n- 발주 변경 후에도 PO(구매발주) 번호를 유지한다.\r\n- 원발주와 이전 버전을 보존하고 변경 요청 PCH(발주 변경 요청)를 연결한다.\r\n- 이월은 기존 PO(구매발주) 잔량의 납품예정을 변경한다. 기존 ASN(공급사 납품예정) 수정이면 번호를 유지하고 변경 이력을 남긴다. 새 납품 차수라면 새 ASN(공급사 납품예정)을 생성한다.\r\n- 잔량 취소는 PCN(발주 잔량 취소)을 연결하고 승인 상태를 기록한다.\r\n- 대체 공급사에 새로 발주하면 새 PO(구매발주)를 생성한다. 기존 PO(구매발주)와 대체 관계를 별도 기록한다.\r\n- 부분 입고가 발생하면 실제 입고 건마다 새 RCV(입고·검수)를 생성한다.\r\n- 문서 변경 버전은 번호와 분리하여 v1, v2 등으로 관리한다.\r\n\r\n예: PO(구매발주) 원발주 90병, RCV(입고·검수) 정상 입고 60병, PCN(발주 잔량 취소) 승인 취소 30병을 각각 보존한다. PO(구매발주) 번호를 바꾸거나 원발주를 삭제하지 않는다.\r\n\r\n6. 센터 이송 규칙\r\n\r\n하나의 TRF(센터 간 이송)에 출발 TOUT(이송 출발)과 도착 TIN(이송 도착)을 연결한다. 부분 도착은 실제 도착 건마다 별도 TIN(이송 도착)을 생성한다.\r\n\r\n예: TRF(센터 간 이송) 12병 → TOUT(이송 출발) 12병 → 첫 TIN(이송 도착) 10병 → 잔량 2병 이동 중 → 추가 TIN(이송 도착) 2병.\r\n\r\n기존 TIN(이송 도착)의 10을 12로 덮어쓰지 않는다. 입력 오류의 정정은 별도 정정 이력으로 처리한다.\r\n\r\n7. 재포장 규칙\r\n\r\n포장이 교체되면 새 PKG(실물 포장 식별자) 번호를 생성하고 기존 PKG(실물 포장 식별자)를 무효 처리한다. 이전 포장과 새 포장의 교체 관계를 기록한다.\r\n\r\n예: 001·002·003 중 002를 교체하여 004 생성 → 유효 포장은 001·004·003, 총 3개.\r\n\r\n동일 포장의 라벨 재출력은 PKG(실물 포장 식별자) 번호를 유지하고 출력 이력을 남긴다. 실제 포장 교체와 단순 재출력을 구분한다.\r\n\r\n8. 채번의 중복 방지\r\n\r\n일련번호는 서버에서 원자적으로 발급한다. 목록의 가장 큰 번호를 조회한 뒤 1을 더하는 방식으로 구현하지 않는다.\r\n\r\n동시 생성·재시도에서도 같은 번호가 중복되지 않도록 문서번호에 유일성 제약을 적용한다.\r\n\r\n동일 생성 요청의 재전송은 같은 문서를 반환한다. 새로운 실제 납품·입고 건은 내용이 같더라도 별도 문서를 생성한다. 중복 판단은 상품·수량의 일치 여부가 아니라 요청 고유 ID로 한다.\r\n\r\n9. 번호 보존\r\n\r\n- 발급한 번호는 수정하거나 다른 문서에 재사용하지 않는다.\r\n- 취소·반려·실패로 번호가 비어도 재채번하거나 뒤 번호를 당기지 않는다.\r\n- 취소·반려 문서는 상태와 이력으로 보존한다.\r\n- 문서 날짜를 수정하거나 소급 처리해도 최초 번호는 유지한다.\r\n- 업무 발생일, 문서 생성일, 승인일, 재고 반영일, 회계 귀속일은 각각 저장한다.\r\n\r\n10. 오프라인 처리\r\n\r\n오프라인 단말은 UUID(중복 방지용 고유 요청번호)로 임시 기록을 생성한다. 전사 일련번호를 단말에서 임의로 발급하지 않는다.\r\n\r\n재연결 후 서버가 문서를 생성하고 정식 번호를 부여한다. 이미 부여된 작업·발주·입고번호는 그대로 참조한다.\r\n\r\n동일 임시 기록을 재전송하면 동일 결과를 반환하고 재고·매입을 중복 반영하지 않는다.\r\n\r\n11. 전표 확정·정정\r\n\r\n문서번호는 식별 기능만 갖는다. 재고·매입 반영은 해당 문서의 확정 상태와 반영 기록으로 관리한다.\r\n\r\n확정 전에는 권한에 따라 수정할 수 있다. 확정 후에는 원기록을 보존하고 취소·역처리·정정 또는 조정 전표로 수정한다.\r\n\r\n전표번호를 새로 부여했다고 재고가 자동 증가하거나 기존 전표가 자동 취소되도록 구현하지 않는다.\r\n\r\n12. 기존 예시 코드 적용\r\n\r\n자료의 PO1001·RCV01·TR01 등은 예시 번호로 취급한다.\r\n\r\n기존 데이터를 가져오는 경우 내부 고유 ID와 정식 문서번호를 부여하고, 원본 번호는 ‘외부 참조번호’에 보존한다. 외부 참조번호는 공급사·출처 시스템과 함께 관리한다.\r\n\r\nW01 같은 화면 코드와 업무 문서번호는 별도 항목으로 관리한다.\r\n\r\n13. 센터·위치 기준정보 확장안\r\n\r\n센터·구역·층·통로·랙·단·칸과 바닥·작업대·도크의 상세 코드 제안은 [DC·PPC 구역·위치번호 설계안](00_DC_PPC_구역_위치번호_운영웹.md)을 참조한다. 위 위치 예시는 이전 형식으로 보존하며, 신규 위치 등록 형식은 확장안 검토 후 적용한다. 업무 문서번호의 접두어·생성일·전사 공통 순번 규칙은 변경하지 않는다.\r\n","00_전체흐름_웹앱정의.md":"# 전체 흐름·웹 앱 정의\n\n## 1. 문서 기준\n| 구분 | 적용 |\n|---|---|\n| 실제 사례 | B마트 공식 WMS(창고·재고 관리)·OMS(주문·출고 관리)·목포 PPC(피킹·포장센터) 운영을 우선. 쿠팡은 참고 사례 |\n| 프로젝트 정의 | 사용자 문서 채번·원문 요구·센터 구역·권한 구성 |\n| 정책 미정 | 업체 공개 근거 없는 계약·승인·시간·비율·원장 차감 사건 |\n\n- 상세 근거·게시시점은 [실사례 조사](14_미정정책_쿠팡_B마트_실사례조사.md).\n- 공통 운영 웹·A~H·문서번호는 실제 B마트 내부 구현으로 단정하지 않음.\n\n## 2. 센터별 전체 흐름\n```mermaid\nflowchart TD\n    S[공급사] --> P[PO(구매발주) 발주·ASN(공급사 납품예정) 납품예정]\n    P --> R[DC(중앙 물류센터) 공급사 입고 RCV(입고·검수)·검수]\n    R --> D[DC(중앙 물류센터) 보관 재고]\n    D --> T[TRF(센터 간 이송) 이관·위치 할당]\n    T --> O[TOUT(이송 출발) 출발·이동중]\n    O --> I[PPC(피킹·포장센터) TIN(이송 도착) 도착·검수]\n    I --> K[PPC(피킹·포장센터) 적치·판매 적합 현물]\n    K --> V[현재·예정·할당 재고 판단]\n    C[고객 바로배달·예약 주문] --> V\n    V --> H[SHP(출하) 출하 단위·출고 요청]\n    H --> W[TSK(작업 식별자) 피킹·PKG(실물 포장 식별자) 포장]\n    H --> B[준비예정시각 기반 배달 요청]\n    W --> E[품질 유지 대기·준비완료]\n    E --> F[유효 포장 확인·HOV(기사 인계) 인계]\n    B --> F\n    F --> L[고객 배송]\n```\n\n| 구간 | 담당 | 핵심 차이 |\n|---|---|---|\n| 공급사→DC(중앙 물류센터) | 구매·입고·정산 | 납품 검수·매입 검토 |\n| DC(중앙 물류센터)→PPC(피킹·포장센터) | DC(중앙 물류센터)·운송·PPC(피킹·포장센터) | 이관·할당·부분 도착. 신규 매입과 구분 |\n| PPC(피킹·포장센터)→고객 | 주문·출고·라이더 | 주문 피킹·포장·인계 |\n\n- DC(중앙 물류센터)와 PPC(피킹·포장센터) 모두 재고 보유. PPC(피킹·포장센터)의 별도 예비보관구역은 공간에 따라 선택.\n- 품질·반품·폐기, 실사·조정, 작업배정은 위 과정과 연결.\n- 입고·검수 화면은 두 센터에서 공통 사용 가능. 근거 문서 RCV(입고·검수)/TIN(이송 도착)은 구분.\n\n근거: [B마트 WMS DC→PPC](https://techblog.woowahan.com/17416/), [B마트 OMS 주문·출고](https://techblog.woowahan.com/22263/).\n\n## 3. 웹·앱 구성\n| 서비스 | 사용자 | 기능·범위 |\n|---|---|---|\n| 공통 운영 웹 | 본사·DC(중앙 물류센터)·PPC(피킹·포장센터) 관리자 | 공통 재고·품질·실사·이관·작업 관리. 센터별 첫 화면·메뉴 |\n| DC(중앙 물류센터) 작업 화면 | DC(중앙 물류센터) 작업자 | 공급사 입고·보관·PPC(피킹·포장센터)별 집품·상차 |\n| PPC(피킹·포장센터) PDA(현장 작업 단말) 화면 | PPC(피킹·포장센터) 작업자 | 이관 도착·적치·보충·고객 피킹·포장·인계 |\n| 공급사 포털 | 공급사 | 등록·상품등록 신청·발주 응답·ASN(공급사 납품예정)·협의·정산 |\n| 기사 기능 | 운송기사·라이더 | 각 배정·인계·지연. 고객 앱과 별도 역할 |\n| 고객 앱 연계 | 고객 | 즉시/예약 주문·배송 약속·주문 변경 안내 |\n| 자동처리 모듈 | 시스템 | 재고·현장 여건 기반 판단·알림·추적 |\n\n- 공통 웹은 프로젝트 구성 권고. 실제 업체 웹 구조 미확인.\n- 관리자 웹·PDA(현장 작업 단말) 통합 제공은 기존 검토 유지. 화면 형식과 승인 권한은 별개.\n- 권한 = 접근센터 × 직무 × 행위 × 배정작업 × 승인조건.\n- ID는 식별자. 화면 메뉴뿐 아니라 서버에서 센터·문서·행위 권한 확인.\n- 기사 별도 앱 구축·기존 서비스 연계 여부는 미정.\n\n## 4. 재고 관제·판매 판단\n| 개념 | 집계·판단 |\n|---|---|\n| 센터 현물 | DC(중앙 물류센터)·PPC(피킹·포장센터) 위치별 관리 수량. 격리 포함 |\n| 센터 간 이동중 | 출발했으나 도착·조정으로 해소되지 않은 물량 |\n| 전체 관리 현물 | DC(중앙 물류센터) + PPC(피킹·포장센터) + 센터 간 이동중. 같은 물량 한 번 집계 |\n| 가용/즉시 판매가능 | 대상 PPC(피킹·포장센터)의 판매 적합 현물에서 예약·할당 제외 |\n| 예정재고 | 미래 입고 약속. 현재 현물에 합산 금지 |\n| 예약 가능 | 예정·현재·확보 물량과 배송 가능시각을 함께 판단 |\n\n- 예약·격리는 재고의 관계·상태. 전체 현물에 더할 별도 물량 아님.\n- DC(중앙 물류센터)에 재고가 있어도 해당 PPC(피킹·포장센터)의 즉시 판매가능으로 바로 표시하지 않음.\n- 센터 관리 현물과 소유권·회계 재고·고객 배송중 집계 범위는 구분.\n\n## 5. 예약·출고 제어\n- B마트 공개 사례: 입고예정 재고 예약 판매·현장 여유 시간 작업 분산.\n- 고객 수령시간과 작업 시작시간 구분. 출고요청·배달요청 분리.\n- 작업 여유·품질 보존 구간에 따라 처리. 재고부족 주문의 SKIP 사례 있음.\n- 마지막 시점 부족 시 고객 연락·취소 기준은 미확인.\n- 포장완료·픽업준비완료·기사인계·재고원장 반영은 별도 사건.\n- 실제 원장 차감 시점·슬롯 판매 상한·대기시간은 [미정 정책](12_운영정책_지침안.md).\n\n## 6. 예외 처리 연결\n| 발견 | 조치 경로 — 프로젝트 흐름 |\n|---|---|\n| 발주 변경·미납품 | PCH(발주 변경 요청)·PCN(발주 잔량 취소)·ASN(공급사 납품예정)·공급사 협의 |\n| 검수 파손·수량 차이 | 실제 수량·품질 상태 기록 → QLT(품질 격리)·계약 검토 |\n| 이관 부족 | TIN(이송 도착) 실제 도착·잔량 유지 → 조사·승인 조정 |\n| 위치 오류·용량 부족 | 차단·재배정·실제 이동 기록 |\n| 실사 차이 | 재계수·변동 대조 → ADJ(재고 조정) |\n| 피킹 결품 | EXC(결품·대체 처리)·고객 결정 → OCN(고객 주문 취소)/RFD(환불)·예약 변경 |\n| 훼손 포장 | 새 PKG(실물 포장 식별자)·기존 무효·교체 관계 |\n| 전달 누락 | 전체 인계완료 보류·실제 전달 상태 추적 |\n| 통신 오류 | 임시저장·결과 조회·같은 요청 ID 재전송 |\n\n## 7. 문서·데이터 연결\n- PO(구매발주) → 여러 ASN(공급사 납품예정)·RCV(입고·검수). 원문서와 내부 고유 상품행까지 연결.\n- TRF(센터 간 이송) → 할당 항목 → TOUT(이송 출발) → 실제 도착별 TIN(이송 도착).\n- ORD(고객 주문) → SHP(출하) → TSK(작업 식별자)·TOTE(재사용 운반 용기) 사용 이력 → PKG(실물 포장 식별자) → HOV(기사 인계).\n- 품질 QLT(품질 격리) → RTV(공급사 반품) 또는 DSP(폐기). 실제 실행·재고 결과 연결.\n- CNT(재고 실사) → 재계수·변동 대조 → ADJ(재고 조정).\n- PUR(매입확정) → 확정 후 PJA(매입 조정). 내부 이관은 중복 매입 생성 금지.\n- 번호 생성과 승인·확정·반영 분리. 번호·이력 보존·한 번만 반영.\n\n상세: [사용자 채번 지침](00_ERP·WMS%20업무%20문서%20채번%20지침.md).\n\n## 8. 추가 확인·미결정 정책\n- Lot 구분·병합. 문서 채번은 이미 사용자 정의 있음.\n- 상품별 잔여 소비기한·격리해제·마감할인 조건.\n- 파손 매입·공급사 변경·취소·비용 조건.\n- 사진 범위·보관기간·폐기 결재선.\n- 실사 잠금·주기·조정 승인.\n- 교대 인계·오프라인 허용 기능.\n- 결품 무응답·대체·환불·부분출하.\n- 원장 차감 사건·인계 증빙·부분인계.\n- 슬롯 상한·접수마감·품질 대기한계.\n\n## 관련 문서\n- [센터·구역·위치번호·운영 웹](00_DC_PPC_구역_위치번호_운영웹.md)\n- [최종 웹·앱 기능 흐름](11_최종_웹앱_기능흐름.md)\n- [실사례 우선 운영정책](12_운영정책_지침안.md)\n- [27개 실제 사례 조사](14_미정정책_쿠팡_B마트_실사례조사.md)\n","01_상품_공급사.md":"# 상품·협력업체(공급사)\n\n## 적용 범위·근거\n- 직매입 납품 협력업체용 포털을 기준으로 정리. 쿠팡 Supplier Hub의 계약·상품등록·발주확인·입고·정산 범위를 참고.\n- [쿠팡 공식 입점 안내](https://supplier.coupang.com/welcome/join/guide.html)는 Supplier Hub와 마켓플레이스 WING을 구분. 이 프로젝트는 공급사 업무를 중심으로 설계.\n- [우아한형제들 협력사 가이드](https://epro.woowahan.com/resources/login/contents/guide.pdf)에서 등록·전자서명 확인. B마트 전용 포털의 전체 기능은 공개 자료로 미확인. 아래 세부 화면·권한은 프로젝트 설계.\n- 공급사 등록·상품등록 신청은 원문 기능. 평가·인증서 로그인·공급량 갱신의 업체 실제 기준은 미확인.\n- 아래 단계·대응표는 프로젝트 흐름. 업체 SOP(표준 업무 절차)로 확인된 범위는 [실사례 조사](14_미정정책_쿠팡_B마트_실사례조사.md) 참조.\n\n## 업무 흐름\n```text\n업체 신청 → 심사·보완 → 거래 승인·계약 → 상품 제안·심사 → 공급조건 확정 → 발주에 제공\n                                                          이후 발주·납품·검수·정산 내역 확인\n```\n\n## 단계별 처리\n| 순서 | 담당·화면 | 처리 | 확인·결과 |\n|---|---|---|---|\n| 1 | 관리자·공급사 포털 | 공급사 등록·입점신청 검토 | SUP(공급사 코드)·거래정보 확보 |\n| 2 | 관리자·공급사 포털 | 상품등록 신청·단위 검토 | SKU(상품 코드)·단위 환산정보 확보 |\n| 3 | 관리자·공급사 포털 | 상품·공급량·납품일 연결 | 발주 시 비교 가능한 조건 |\n| 4 | 관리자 웹 | 조건 검토 | 구매·보관·검수 기준 제공 |\n| 5 | 관리자·시스템 | 거래 이력 집계 | 평가·우선순위 반영은 제안 |\n\n## 문제 발생 시 지침\n| 발생 상황 | 즉시 조치 | 확인·후속 처리 | 재개 조건 |\n|---|---|---|---|\n| 바코드·구매단위 식별 불가 | 담당자 확인 요청 | 기준정보 확인·수정 권장 | 상품·환산단위 확인 |\n| 공급 가능량·납품일 미확인 | 확정 정보로 간주하지 않음 | 공급사에 최신 조건 확인 권장 | 조건 확인 후 발주 판단 |\n| 지연·파손 반복 | 거래 근거 기록 | 평가 항목·가중치 정책에 따라 검토 | 우선순위 적용 여부 결정 |\n\n기준정보 오류 대응은 운영 제안. 평가·갱신 기준은 아래 미결정 정책 참조.\n\n## 협력업체 포털 기능·권한\n| 메뉴 | 협력업체 기능 | 내부 담당자 기능·연결 |\n|---|---|---|\n| 업체·계정 | 사업자정보·담당자·계좌·증빙 제출, 직원 계정 신청 | 심사·보완·승인, 거래 상태·계정 권한 관리 |\n| 계약·거래조건 | 계약 확인·서명, 조건 변경 요청 | 공급가·납품·지급조건 검토·확정 |\n| 상품 제안 | 바코드·규격·이미지·공급가·보관조건 제출 | 심사·반려·보완, 승인 상품을 내부 SKU(상품 코드)와 연결 |\n| 발주 | 발주 확인, 가능 수량·납기 회신, 변경·취소 응답 | [구매·발주](02_구매_발주.md)에서 확정·잔량 관리 |\n| 납품 예정·출하 | ASN(공급사 납품예정) 등록, 출하수량·서류 제출 | [입고·검수](03_입고_검수.md) 예정과 연결 |\n| 검수 결과 | 입고·정상·부족·파손·불합격 결과 확인, 이의 제기 | 센터가 검수 기록 확정. 공급사는 결과를 직접 수정하지 않음 |\n| 반품·품질 | 반품 내역·증빙 확인, 회수 일정 회신 | [품질·반품·폐기](05_품질_반품_폐기.md)에서 결정·처리 |\n| 매입·정산 | 인정 내역·공제 사유·지급 예정·지급 결과 확인, 문의 | [매입·정산](10_매입_정산.md)에서 대조·확정 |\n| 공지·문의 | 납품 기준·자료 조회, 문서별 문의·보완 응답 | 담당자 답변·공지, 처리 이력 보존 |\n| 거래 현황 | 자기 업체의 발주·납품·반품·정산 조회 | 업체별 납기·공급 충족·품질 근거 집계 |\n\n### 접근·변경 원칙 — 프로젝트 설계\n- 업체 소속 계정은 자기 업체의 상품·문서·거래 자료만 조회.\n- 업체 관리자·상품 담당·납품 담당·정산 담당의 권한을 구분. 상세 역할 구성은 별도 확정.\n- 계좌·공급가·계약조건 변경은 요청과 승인 이력을 남김. 승인된 거래조건을 공급사가 직접 덮어쓰지 않음.\n- DC(중앙 물류센터)·PPC(피킹·포장센터) 내부 위치 배정·피킹·배차·재고 조정은 내부 운영 권한. 납품센터·검수 결과 등 거래에 필요한 정보만 공유.\n- 개인별 계정으로 요청·승인·응답자를 기록. 인증서 로그인은 기존 제안이며 실제 인증 방식은 미결정.\n\n### 업체·상품 심사 상태 — 프로젝트 설계\n| 대상 | 상태 흐름 | 보완·반려 시 처리 |\n|---|---|---|\n| 업체 신청 | 작성 → 제출 → 검토 → 승인 | 보완 요청 → 재제출. 반려 사유 보존 |\n| 계약 | 협의 → 서명 대기 → 체결 | 조건 변경 시 이전 계약·적용일 보존 |\n| 상품 신청 | 작성 → 제출 → 검토 → 승인·거래 가능 | 바코드·단위·품질정보 누락 시 보완. 중복 상품은 기존 SKU(상품 코드) 연결 검토 |\n\n등록 승인과 계약 체결, 상품 거래 승인은 별도 판단. 계좌 불일치·증빙 누락은 담당자 검토 후 보완하며, 검증 방식·필수 서류 목록은 미결정.\n\n## 상세 기능·규칙\n\n### 책임\n- 상품 기준정보·공급사 거래정보 관리.\n- 발주·보관·검수에 필요한 기준 제공.\n\n### 상품 기능\n- 상품코드·바코드 등록.\n- 낱개·박스 단위 구분.\n- 박스당 낱개 수량·구매단위 관리.\n- 상품군·보관온도·보관조건 관리.\n- 소비기한 관리 대상 구분.\n- 상품별 공급사 연결.\n\n### 공급사 기능\n- 공급사 등록·로그인·담당자 관리.\n- 취급상품·공급 가능 수량·납품 가능일 관리.\n- 거래 조건·정산 조건 확인.\n- 인증서 로그인은 원문 제안. 인증 방식 별도 결정.\n- 입점신청. \n- 상품등록신청.\n- 상품별 공급가·최소주문량·구매 묶음·납품 리드타임·납품 가능 센터·조건 적용기간 관리는 프로젝트 보충안.\n- 공급 가능 정보에는 갱신 시각을 표시. 포털의 참고 가능량과 특정 PO(구매발주)에 회신한 약속 수량을 구분.\n\n### 평가·추천 제안\n- 납기 지연·파손·미납품 이력 집계.\n- 일정 수준 이상 파손 건 기록.\n- 공급사 신뢰도·거래 우선순위 산정.\n- 발주 화면에서 우선순위·재고·납품일 비교.\n\n### 주요 데이터\n- 상품, 바코드, 수량 단위, 포장단위.\n- 공급사, 담당자, 공급상품, 공급조건.\n- 공급사 평가 근거·점수·우선순위.\n\n### 연결 화면\n- 관리자 웹: 상품·공급사·거래조건 관리.\n- 공급사 포털: 업체·계약·상품 신청, 공급 가능 정보, 발주·납품·검수·정산·문의.\n- PDA(현장 작업 단말): 스캔 상품 식별·보관조건 조회.\n\n## 추가 확인·미결정 정책\n- 공급 가능 정보의 갱신 주체·주기.\n- 평가 항목·가중치·우선순위 반영 방식.\n- 필수 서류·심사 기준·계약 서명 방식·심사 처리기한.\n- 계좌 변경 검증·승인 절차, 업체 직원 계정 승인 주체.\n- 거래 중지 시 진행 중인 발주·반품·정산 처리 범위.\n\n## 문서·식별자 및 연결 규칙\n- 상품 `SKU-000001`, 공급사 `SUP-000001`: 기준정보 코드.\n- 센터 `PPC-GN-01`: 기준정보 코드. 위치의 구역·층·통로·랙·단·칸 확장안 참조. 짧은 위치번호는 이전 예시로 보존.\n- 기준정보 코드는 발주·입고 문서번호와 분리.\n- 외부 상품·공급사 코드는 출처와 함께 별도 참조 관리.\n\n\n## 관련 정의\n- [사용자 채번](00_ERP·WMS%20업무%20문서%20채번%20지침.md)\n- [실사례 우선 운영정책](12_운영정책_지침안.md)\n- [센터·구역·공통 웹](00_DC_PPC_구역_위치번호_운영웹.md)\n","02_구매_발주.md":"# 구매·발주\n\n## 적용 범위·근거\n- [쿠팡 Supplier Hub 공식 안내](https://supplier.coupang.com/welcome/join/guide.html)에서 상품등록·발주확인·입고·정산 범위 확인. 협력업체의 세부 응답 상태·ASN(공급사 납품예정) 항목·변경 승인 규칙은 아래 프로젝트 정의.\n- 변경·잔량 협의는 원문·사용자 채번 규칙. 실제 공급사 승인·파손 비용 조건은 계약 확인 필요.\n- 아래 단계·대응표는 프로젝트 흐름. 업체 SOP(표준 업무 절차)로 확인된 범위는 [실사례 조사](14_미정정책_쿠팡_B마트_실사례조사.md) 참조.\n\n## 업무 흐름\n```text\n수량 계산 → PO(구매발주) 초안 저장 → 발주 전달 → 공급사 수량·납기 회신 → 합의 확정 → ASN(공급사 납품예정) 등록·출하\n                                                                     → 입고·검수 → 잔량 처리 → 종료\n                           변경 필요 → PCH(발주 변경 요청) 요청 → 공급사 승인 → 같은 PO(구매발주) 갱신\n                           잔량 취소 → PCN(발주 잔량 취소) 요청 → 공급사 승인 → 잔량 취소\n```\n\n## 단계별 처리\n| 순서 | 담당·화면 | 처리 | 확인·결과 |\n|---|---|---|---|\n| 1 | 관리자 웹 | 필요수량·묶음 수량 계산 | 87병 필요·6병 단위 → 90병 |\n| 2 | 관리자 웹 | 초안 최초 저장·발주 전달 | PO(구매발주) 생성·상품행 확보 |\n| 3 | 공급사 포털·관리자 | 전량 수락 또는 공급 가능한 수량·납기 회신·협의 | 부족 회신만으로 PO(구매발주) 자동 축소하지 않음 |\n| 3-1 | 공급사 포털 | 합의 조건에 맞춰 ASN(공급사 납품예정)·출하정보 등록 | PO(구매발주) 상품행·납품 차수·센터 연결 |\n| 4 | 관리자 웹 | 입고 진행·잔량 확인 | RCV(입고·검수) 실적 연결 |\n| 5 | 관리자·공급사 | 이월·취소 협의 | ASN(공급사 납품예정) 변경·새 차수 또는 PCN(발주 잔량 취소) 승인 |\n| 6 | 관리자 웹 | 잔량 처리 확인·마감 | 원발주·실입고·취소 이력 보존 |\n\n## 문제 발생 시 지침\n| 발생 상황 | 즉시 조치 | 확인·후속 처리 | 재개·완료 조건 |\n|---|---|---|---|\n| 수량·납기 변경 | PCH(발주 변경 요청) 요청·기존 발주 유지 | 공급사 응답·입고 실적 확인 | 공급사 승인 후 변경 |\n| 변경수량이 납품 완료량 미만 | 적용 차단 | 이미 완료된 수량 재확인 | 완료량 이상으로 수정 |\n| 미납품 잔량 | 입고수량 조작 금지 | ASN(공급사 납품예정) 이월 또는 PCN(발주 잔량 취소) 취소 협의 | 일정 재확정 또는 취소 승인 |\n| 초과 납품 | 임의 발주수량 변경 금지 | 반송 또는 추가발주 협의 | 반송 결정 또는 추가발주 승인 |\n| 납기 지연 | 공급사 일정 확인 | 일정 변경·대체 공급사 검토 | 새 일정 또는 새 PO(구매발주) 확정 |\n| 발주 미응답 | 미응답 현황·연락 이력 기록 | 담당자가 공급 가능 여부 확인 | 응답 또는 계약상 종료 조건 확인. 자동 수락 금지 |\n| 일부 수량만 공급 가능 | 원발주·공급사 회신을 각각 보존 | 잔량 이월·취소·대체 조달 협의 | 합의된 변경·취소 적용 |\n| 출하량과 검수 결과 불일치 | 원 ASN(공급사 납품예정)·센터 결과 보존 | 차이 사유·증빙 확인, 이의 처리 | 센터 결과·매입 인정 결과 각각 확정 |\n\n## 상세 기능·규칙\n\n### 책임\n- 구매 필요수량 산정·발주 확정.\n- 공급사와 발주 변경·납기·잔량 협의.\n\n### 수량 계산\n- 예상 수요·안전재고 기준 필요수량 계산.\n- 필요한 낱개 수량과 구매 묶음 수량 구분.\n- 묶음 수량은 올림 처리.\n- 예: 87병 필요 / 6병 묶음 → 15박스·90병 발주.\n- 제안: 전월 판매량·월별 평균 판매량 표시.\n- 제안: 필요수량·공급사 우선순위 추천.\n- 제공 자료 보충 예시: 필요량 = max(0, 예상 수요 + 안전재고 − 사용 가능한 현재 재고 − 해당 기간 확정 입고예정). 묶음은 올림. 실제 예측모델·예정 신뢰도는 미정.\n\n### 기본 흐름\n1. 관리자: 공급사·센터·상품·수량 지정.\n2. 발주 초안 최초 저장·PO(구매발주) 번호 생성.\n3. 공급사: 전량 수락·일부 공급 가능·납기 조정·공급 불가 회신. 응답 방식은 프로젝트 설계.\n4. 관리자·공급사: 차이 협의 후 확정. 공급사: ASN(공급사 납품예정) 등록·출하정보 제출. 분할 납품 가능.\n5. 입고 결과 수신·진행도 갱신.\n6. 미납품 잔량 처리·발주 종료.\n\n### 포털 화면·데이터 — 프로젝트 설계\n| 화면 | 주요 항목 | 처리 |\n|---|---|---|\n| 발주 목록·상세 | PO(구매발주)·버전·상품행·납품센터·수량·단가·요청 납기·응답 상태 | 조회·다운로드·확인·회신 |\n| 공급 가능 회신 | 가능 수량·가능 납기·부족 사유·회신자·시각 | 관리자 검토. 합의 전에는 원 PO(구매발주) 유지 |\n| 변경·취소 협의 | 원 조건·요청 조건·사유·PCH(발주 변경 요청)/PCN(발주 잔량 취소)·응답 | 수락·조정 제안·거절 및 이력 |\n| 납품 예정·출하 | ASN(공급사 납품예정)·PO(구매발주) 상품행·센터·예정일·수량·출하일·첨부서류 | 등록·수정 이력·출하 보고 |\n| 입고 진행·차이 | 출하량·실입고량·정상·파손·불합격·미납 잔량 | 결과 조회·차이 문의·잔량 협의 |\n| 거래 문서 문의 | 관련 PO(구매발주)/ASN(공급사 납품예정)/RCV(입고·검수)·상품행·질문·증빙 | 담당자 답변·처리 상태 관리 |\n\n소비기한·제조 로트 등 ASN(공급사 납품예정) 제출 항목은 상품별로 결정. 입고 예약 슬롯·차량정보·라벨 출력·일괄 업로드는 추가 검토 기능이며 B마트·쿠팡의 공통 확정 기능으로 간주하지 않음.\n\n### 발주·납품 상태 구분\n- 발주: 초안 → 전달 → 응답·협의 → 수락·확정 → 이행 중 → 잔량 처리 완료·종료. 미응답·공급 불가·변경 협의는 별도 표시.\n- 납품: 예정 등록 → 출하 보고 → 센터 도착 → 검수 → 결과 확정. 분할 납품은 ASN(공급사 납품예정)별 진행도 관리.\n- 발주 확인, 공급 약속, 출하 보고, 센터 입고 확정을 각각 기록. 공급사 출하 보고로 센터 재고를 증가시키지 않음.\n- 정상·파손·불합격 수량의 매입 인정 여부는 계약과 [매입·정산](10_매입_정산.md)에서 판단. 정상수량만으로 발주 잔량을 자동 계산하지 않음.\n- 잔량 산식은 발주 이행으로 인정할 수량·반품 후 재납품 조건·승인 취소량을 확정한 뒤 적용. 공개 사례에서 세부 산식은 미확인.\n\n### 수량 차이 예시\n| 사건 | 기록 | 후속 판단 |\n|---|---|---|\n| PO(구매발주) 100개·공급 가능 80개 회신 | 발주 100·약속 가능 80 각각 보존 | 20개 이월·취소·대체 조달 협의 |\n| 100개 출하·실입고 100개 중 정상 95·파손 5 | 출하 100·실입고 100·검수 결과 95/5 보존 | 파손 5의 반품·재납품·매입 인정은 계약에 따라 결정 |\n| 100개 출하·센터 실입고 98개 | 출하 100·실입고 98·차이 2 보존 | 운송·수량 증빙 확인. 원 ASN(공급사 납품예정)을 98로 덮어쓰지 않음 |\n\n### 변경·잔량\n- 관리자는 변경요청만 등록.\n- 공급사 승인 후 발주 변경 적용.\n- 변경 전후 수량·사유·요청자·응답 기록.\n- 이미 납품 완료된 수량 미만으로 변경 차단.\n- 잔량 이월: 공급사 협의 후 다음 납품으로 연결.\n- 잔량 취소: 공급사 승인 후 취소.\n- 실제 입고수량을 변경해 발주 마감하지 않음.\n- 이월 잔량은 기존 PO(구매발주) 유지·ASN(공급사 납품예정) 변경 또는 새 차수 생성. 이월 근거 보존.\n\n### 예외\n- 초과 납품: 반송 협의 또는 추가발주 승인.\n- 납기 지연: 대체 공급사 검토 또는 납품일 재확정.\n- 필요 시 고객 안내로 연결.\n\n### 주요 데이터·화면\n- 발주서·발주항목·변경요청·공급사 응답·잔량 처리.\n- 관리자 웹: 발주 추천·등록·조회·변경요청·잔량 처리.\n- 공급사 포털: 발주 확인·수락·변경 응답·일정 협의.\n\n## 추가 확인·미결정 정책\n- 수요·안전재고 산정 방식.\n- 이월은 기존 PO(구매발주)·ASN(공급사 납품예정) 유지/새 차수라는 사용자 정의 적용. 미정: 종료 상태·잔량 해소 기준·협의 조건.\n- 납기 지연 시 대체 발주 승인 기준.\n- 발주 응답기한·미응답 종료 조건·공급사 회신 후 변경 적용 절차.\n- 상품별 ASN(공급사 납품예정) 필수 항목·출하 후 수정 허용 범위·납품 예약 필요 여부.\n- 파손·불합격·반품 수량의 발주 이행 인정 및 재납품 조건.\n\n## 문서·식별자 및 연결 규칙\n- `PO`(구매발주): 발주 초안 최초 저장 시 생성. 수락·변경 후에도 유지.\n- `PCH`(발주 변경 요청): 수량·납기 변경요청 생성. 원 PO(구매발주)·대상 상품행 연결.\n- `PCN`(발주 잔량 취소): 잔량 취소요청 생성. 공급사 승인 상태 기록.\n- 원발주·이전 버전 보존. 버전 `v1`, `v2`는 번호와 분리.\n- 이월은 기존 PO(구매발주) 잔량의 납품예정 변경. 기존 ASN(공급사 납품예정) 수정 시 번호 유지·이력 보존.\n- 새 납품 차수는 새 ASN(공급사 납품예정) 생성. 이월만으로 새 PO(구매발주)를 생성하지 않음.\n- 대체 공급사 발주는 새 PO(구매발주) 생성·기존 PO(구매발주)와 대체 관계 기록.\n- PO(구매발주) 90병 / 정상 입고 RCV(입고·검수) 60병 / 승인 취소 PCN(발주 잔량 취소) 30병을 각각 보존.\n\n\n## 관련 정의\n- [사용자 채번](00_ERP·WMS%20업무%20문서%20채번%20지침.md)\n- [실사례 우선 운영정책](12_운영정책_지침안.md)\n- [센터·구역·공통 웹](00_DC_PPC_구역_위치번호_운영웹.md)\n","03_입고_검수.md":"# 입고·검수\n\n## 적용 범위·근거\n- B마트 입고 수량·품질·소비기한 검수 확인. 승인 생략·사진 범위·오프라인 확정은 프로젝트 규칙 또는 미정.\n- 아래 단계·대응표는 프로젝트 흐름. 업체 SOP(표준 업무 절차)로 확인된 범위는 [실사례 조사](14_미정정책_쿠팡_B마트_실사례조사.md) 참조.\n\n## 입고 유형 구분\n| 유형 | 문서 | 매입 |\n|---|---|---|\n| 공급사→DC(중앙 물류센터) | PO(구매발주)·ASN(공급사 납품예정)·RCV(입고·검수) | 계약에 따라 PUR(매입확정) 검토 |\n| DC(중앙 물류센터)→PPC(피킹·포장센터) | TRF(센터 간 이송)·TOUT(이송 출발)·TIN(이송 도착) | 내부 이관. 중복 신규 매입 금지 |\n| PPC(피킹·포장센터) 직접 공급사 입고 | 허용 시 PO(구매발주)·ASN(공급사 납품예정)·RCV(입고·검수) | 계약별 검토 |\n\n아래 RCV(입고·검수) 흐름은 공급사 입고. 센터 이관은 운송·인계와 연결.\n\n## 업무 흐름\n```mermaid\nflowchart TD\n    A[발주·ASN(공급사 납품예정) 선택] --> B[상품 스캔·수량·로트 입력]\n    B --> C{상품·수량 검증}\n    C -->|불일치| D[확정 차단·재확인]\n    D --> B\n    C -->|통과| E{부족·초과·파손 여부}\n    E -->|없음| F[RCV(입고·검수) 검수 확정]\n    E -->|있음| G[이상 보고·증빙·협의]\n    G --> H[실제 검수 결과 기록·정상품과 격리품 구분]\n    H --> I[정책에 따른 확정·후속 조치]\n    F --> J[재고 반영·결과 표시]\n    I --> J\n```\n\n## 단계별 처리\n| 순서 | 담당·화면 | 처리 | 확인·결과 |\n|---|---|---|---|\n| 1 | 공급사 포털 | ASN(공급사 납품예정) 저장 | PO(구매발주)·상품행·예정 수량 연결 |\n| 2 | PDA(현장 작업 단말) | 도착·검수 건 최초 저장 | RCV(입고·검수) 생성. 오프라인은 UUID(중복 방지용 고유 요청번호) |\n| 3 | PDA(현장 작업 단말) | 스캔·수량·로트·소비기한 입력 | 도착 = 정상 + 파손 |\n| 4 | PDA(현장 작업 단말)·관리자 | 정상 확정 또는 이상 보고 | 정상은 관리자 승인 없이 처리 |\n| 5 | 시스템 | 확정 결과 반영 | 정상·격리 구분·중복 반영 방지 |\n| 6 | 품질·정산 담당 | 반품·폐기·매입 판단 | 입고수량과 인정금액 분리 |\n\n## 문제 발생 시 지침\n| 발생 상황 | 즉시 조치 | 확인·후속 처리 | 재개·완료 조건 |\n|---|---|---|---|\n| 다른 상품 스캔 | 스캔 차단·대상 안내 | 상품·선택 발주 재확인 | 올바른 상품 확인 |\n| 수량 합계 불일치 | 확정 차단 | 도착·정상·파손 재계수 | 합계 일치 |\n| 파손·부족·초과 | 보고·증빙 확보·결제 자동 확정 보류 | 격리·반송·추가발주·매입 협의 | 정책·협의 결과에 따라 처리 |\n| 연결 끊김 | 임시저장·전송 대기 | 복구 후 같은 UUID(중복 방지용 고유 요청번호) 재전송 | 기존 결과 조회·한 번만 반영 |\n| 확정 응답 미수신 | 새 입고 건 임의 생성 금지 | 확정 여부 먼저 조회 | 미처리면 동일 요청 재전송 |\n| 확정 후 입력 오류 | 원기록 보존 | 권한에 따라 정정·역처리 | 정정 이력·반영 결과 확인 |\n\n이상 건의 확정 가능 시점은 운영 정책에 따름. 검수 사실과 공급사 협의 결과는 구분 기록.\n\n## 상세 기능·규칙\n\n### 책임\n- 납품예정·실제 도착·검수 결과 기록.\n- 확정 결과를 재고·품질·정산에 전달.\n\n### 납품예정\n- 공급사에서 ASN(공급사 납품예정) 등록.\n- 발주별 분할 납품 일정·수량 관리.\n- 예: 90병 발주 → 60병 ASN(공급사 납품예정) + 30병 ASN(공급사 납품예정).\n- 관리자 웹: 입고예정·미확정 예정 조회.\n- 예정 없음과 조회 실패를 별도 표시.\n\n### 검수 흐름\n1. 발주·ASN(공급사 납품예정) 선택.\n2. 상품 바코드 스캔.\n3. 도착·정상·파손 수량 입력.\n4. 로트·소비기한 기록.\n5. 검증·검수 확정.\n6. 결과 표시·재고 반영.\n\n### 확정 조건\n- 다른 상품 스캔 차단·대상 상품 안내.\n- 원문 단순안: 도착수량 = 정상수량 + 파손수량. 기한 불명·기타 품질 보류는 파손으로 오분류하지 않도록 상태 확장 필요.\n- 불일치 시 확정 차단.\n- 정상 검수는 관리자 확인 없이 처리.\n- 부족·초과·파손은 관리자 보고·후속 처리.\n- 예외 건 결제 자동 확정 보류.\n\n### 증빙·후속 처리\n- 납품서·운송장·현장사진·불량사진 연결.\n- 정상품과 격리품 구분 반영.\n- 파손품은 품질 도메인에서 반품·폐기 결정.\n- 매입 인정 수량은 정산 도메인에서 결정.\n\n### 통신·중복\n- 연결 끊김 시 임시저장.\n- 복구 후 같은 요청 ID 재전송·서버 권한/상태 재검증. 오프라인 임시저장은 확정이 아님.\n- 동일 확정 요청은 한 번만 반영.\n- 확정 여부·전송상태 조회.\n- 응답 미수신 시 기존 처리 결과 확인 후 재처리.\n\n### 주요 데이터·화면\n- ASN(공급사 납품예정)·ASN(공급사 납품예정)항목·입고서·검수항목·로트정보·증빙.\n- 공급사 포털: ASN(공급사 납품예정) 등록·조회.\n- PDA(현장 작업 단말): 검수예정·스캔·수량 입력·확정·문제 보고.\n- 관리자 웹: 입고현황·검수 예외 검토.\n\n## 추가 확인·미결정 정책\n- 정상 입고 포함 매건 촬영 또는 이상 건만 촬영.\n- 입고 즉시 격리 또는 즉시 공급사 반송.\n\n## 문서·식별자 및 연결 규칙\n- `ASN`(공급사 납품예정): 납품예정 최초 저장 시 생성. PO(구매발주)·대상 상품행 연결.\n- `RCV`(입고·검수): 실제 도착·검수 건 최초 저장 시 생성.\n- PO(구매발주) 한 건에 여러 ASN(공급사 납품예정)·RCV(입고·검수) 연결. RCV(입고·검수)는 ASN(공급사 납품예정)·PO(구매발주) 상품행까지 참조.\n- 실제 부분입고마다 새 RCV(입고·검수) 생성. 같은 RCV(입고·검수)의 검수·확정은 상태·이력 관리.\n- 입고번호 생성만으로 재고·매입 반영 금지. 확정 상태·반영 기록으로 관리.\n- 확정 후 수량 덮어쓰기 금지. 원기록 보존·정정 또는 역처리.\n- 오프라인 기록은 단말 UUID(중복 방지용 고유 요청번호) 사용. 재연결 후 서버에서 정식 번호 발급.\n- 기존 작업·발주·입고번호는 그대로 참조. 재전송 시 UUID(중복 방지용 고유 요청번호) 유지.\n\n\n## 관련 정의\n- [사용자 채번](00_ERP·WMS%20업무%20문서%20채번%20지침.md)\n- [실사례 우선 운영정책](12_운영정책_지침안.md)\n- [센터·구역·공통 웹](00_DC_PPC_구역_위치번호_운영웹.md)\n","04_재고관리.md":"# 재고관리\n\n## 적용 범위·근거\n- B마트 실시간 재고·이관 위치 자동/수동 할당, 쿠팡 분산 적치·재고조사 확인. 보충 임계값·실사 방식은 미확인.\n- 아래 단계·대응표는 프로젝트 흐름. 업체 SOP(표준 업무 절차)로 확인된 범위는 [실사례 조사](14_미정정책_쿠팡_B마트_실사례조사.md) 참조.\n\n## 업무 흐름\n```text\n입고 재고 → MOV(센터 내부 이동·적치·보충) 적치·보충·이동 지시 → 스캔·수량 확인 → 목적지 확인 → 확정 → 위치별 갱신\n실사 CNT(재고 실사) → 계수 → 차이 확인 → 재계수·이동내역 검증 → ADJ(재고 조정) 요청 → 승인·확정\n```\n\n## 단계별 처리\n| 순서 | 담당·화면 | 처리 | 확인·결과 |\n|---|---|---|---|\n| 1 | 관리자·시스템 | 위치·수량·MOV(센터 내부 이동·적치·보충) 지정 | 보관조건·수용량 확인 |\n| 2 | PDA(현장 작업 단말) | 출발위치·상품·로트 확인 | 대상·실제 수량 일치 |\n| 3 | PDA(현장 작업 단말) | 이동·목적지 스캔 | 위치·보관조건 일치 |\n| 4 | 시스템 | MOV(센터 내부 이동·적치·보충) 확정 반영 | 출발 감소·목적지 증가·센터 총량 유지 |\n| 5 | 관리자·PDA(현장 작업 단말) | CNT(재고 실사) 실사·재계수 | 기준시각 이후 이동 반영 |\n| 6 | 승인자 | ADJ(재고 조정) 검토·확정 | 근거·승인·조정량 보존 |\n\n## 문제 발생 시 지침\n| 발생 상황 | 즉시 조치 | 확인·후속 처리 | 재개·완료 조건 |\n|---|---|---|---|\n| 오상품·오위치·조건 불일치 | 확정 차단 | 올바른 상품·위치 안내 | 지정 조건 일치 |\n| 선반 용량 부족 | 임의 적치 대신 보고 | 분할 적치·목적지 재배정 | 실제 위치·수량 확인 |\n| 이동수량 부족·위치 재고 없음 | 차이 보고 | 관리자 조사·수량 확인 | 확인된 수량·지시로 재개 |\n| 실사 차이 | 바로 감산하지 않음 | 재계수·기준시각 이후 이동 검증 | 잔여 차이 ADJ(재고 조정) 승인 |\n| 이동 확정 응답 오류 | 결과 먼저 조회 | 동일 요청 ID 재전송 | 위치별 한 번만 반영 |\n\n## 상세 기능·규칙\n\n### 책임\n- 실물 위치·수량·로트·상태 관리.\n- 이동·실사·조정의 수량 근거 보존.\n\n### 관리 단위\n- 상품 × 센터 × 로케이션 × 로트 × 재고상태.\n- 현물수량·판매가능수량 구분.\n- 격리품은 현물에 포함, 판매에서 제외.\n- 반품·폐기 완료 후 현물 차감.\n- 제안: 재고변동원장·현재 잔량·주문 예약을 구분 관리.\n- 제안: 판매가능 상태 재고에서 예약수량·소비기한 제한 반영.\n\n### 로트\n- 원문 로트 구분안: 입고일·공급사·품목·소비기한. 내부 ID·공급사 Lot 보존은 사용자 정의. 병합·제조 Lot 중심 구분은 미정.\n- 로트번호·초기수량·소비기한 기록.\n- 로트별 수량·추적정보 혼합 방지. 같은 위치의 복수 로트는 혼재 정책으로 결정.\n- 소비기한 기준 출고 대상 추천.\n- 로트 내부 고유 ID와 공급사 Lot값 구분 보존. 제조사 로트정보는 확인 가능한 경우 추가 기록.\n\n### 적치·보충·센터 내 이동\n- 입고장 → 보관구역 적치.\n- 보관구역 → 피킹선반 보충.\n- 센터 내 다른 위치로 이동.\n- 출발위치·상품·목적지 스캔.\n- 실제 이동수량 입력·확정.\n- 출발위치 차감·목적지 증가. 센터 총수량 유지.\n- 오상품·오위치·보관조건 불일치 차단.\n- 부족·용량 초과 시 차이 보고.\n- 분할 적치·목적지 변경 시 실제 위치·수량 기록.\n- 확정 오류 시 결과 조회·중복 이동 방지.\n\n### 배치·보충 — 실사례와 구현안\n- 위치별 수용량·보관조건 확인.\n- 적치 위치 추천·작업 배정.\n- 실사례: 쿠팡 동일 상품 복수 위치 배치. 목포 PPC(피킹·포장센터) 무게·주문빈도·패킹 접근 동선 고려.\n- 한 선반의 복수 상품 보관 여부는 운영조건에 따라 결정.\n- 피킹선반 최소수량 기준 보충 추천.\n- 작업자 수동 보충요청 지원.\n\n### 실사·조정\n1. 대상·기준시각·장부수량 기록.\n2. 실물수량 계수.\n3. 차이 발생 시 다른 작업자 재계수.\n4. 기준시각 이후 입출고·이동 반영.\n5. 차이 지속 시 조정요청.\n6. 권한자 검토·승인·조정 확정.\n- 조정 사유·증빙·승인자 보존.\n- 중복 조정·이중 차감 방지.\n\n### 외부 제공\n- 고객 앱에 판매가능 재고 제공.\n- 제안: 지역·센터 재고 기반 배송 가능일 제공.\n- 즉시 판매가능과 예정재고 예약 가능 분리. 예정 물량은 현물에 합산하지 않음.\n\n### 전체 재고 관제 — 프로젝트 집계\n| 항목 | 기준 |\n|---|---|\n| 센터 현물 | DC(중앙 물류센터)·PPC(피킹·포장센터) 위치별 실제 관리 수량. 격리 포함 |\n| 이동중 | 출발분 − 도착분 − 승인 잔량 처리 |\n| 전체 관리 현물 | DC(중앙 물류센터) 현물 + PPC(피킹·포장센터) 현물 + 센터 간 이동중 |\n| 즉시 판매가능 | 서비스 대상 PPC(피킹·포장센터)의 판매 적합 현물 − 유효 예약/할당 |\n| 예정재고 | 미래 공급 약속. 현물에 포함하지 않음 |\n\n- 예약·격리는 현물에 다시 더하지 않음. 같은 물량은 한 번만 집계.\n- 고객 배송중·공급사 미인수 물량은 별도 범위. 소유·회계 재고는 계약 기준.\n- DC(중앙 물류센터) 재고만으로 PPC(피킹·포장센터) 즉시 배송 가능 표시 금지.\n\n### 주요 데이터·화면\n- 위치·로트·재고잔량·재고변동·예약·이동·실사·조정.\n- 관리자 웹: 재고조회·이동현황·실사·조정 승인.\n- PDA(현장 작업 단말): 적치·보충·이동·실사·차이 보고.\n\n## 추가 확인·미결정 정책\n- 작업 중단 실사 또는 운영 중 실사.\n- 전체 실사 또는 품목·구역별 순환 실사.\n- 조정 승인자 수·승인 조건.\n- 출고 재고 차감 시점.\n\n## 문서·식별자 및 연결 규칙\n- `MOV`(센터 내부 이동·적치·보충): 적치·보충·센터 내부 이동 지시 생성 시 발급.\n- `CNT`(재고 실사): 실사 문서 생성 시 발급.\n- `ADJ`(재고 조정): 재고 조정요청 생성 시 발급. 실사 차이 조정은 CNT(재고 실사)·대상 항목 연결.\n- Lot: 내부 고유 ID와 공급사 Lot값 분리. 공급사 Lot값만으로 전사 유일성 판단 금지.\n- 센터·위치는 기준정보 코드로 참조. 문서번호에 위치정보 포함 금지.\n- 이동·조정 번호 발급은 수량 반영 아님. 확정 상태·반영 기록으로 중복 차단.\n- 확정 후 원기록 보존. 수정은 정정·역처리·조정 이력으로 관리.\n\n\n## 관련 정의\n- [사용자 채번](00_ERP·WMS%20업무%20문서%20채번%20지침.md)\n- [실사례 우선 운영정책](12_운영정책_지침안.md)\n- [센터·구역·공통 웹](00_DC_PPC_구역_위치번호_운영웹.md)\n","05_품질_반품_폐기.md":"# 품질·반품·폐기\n\n## 적용 범위·근거\n- B마트 신선 검품·품질 미달 판매 제외·마감할인 확인. 해제·폐기 결재·잔여기간은 미확인.\n- 아래 단계·대응표는 프로젝트 흐름. 업체 SOP(표준 업무 절차)로 확인된 범위는 [실사례 조사](14_미정정책_쿠팡_B마트_실사례조사.md) 참조.\n\n## 업무 흐름\n```text\n이상 발견 → QLT(품질 격리) 격리·출고 제외 → 재검수·공급사 협의\n                                  ├─ 적합 → 격리 해제·판매 재개\n                                  ├─ 반품 → RTV(공급사 반품) → 실제 반출 → 재고·정산 반영\n                                  └─ 폐기 → DSP(폐기) 요청 → 승인 → 실행 → 재고 반영\n```\n\n## 단계별 처리\n| 순서 | 담당·화면 | 처리 | 확인·결과 |\n|---|---|---|---|\n| 1 | PDA(현장 작업 단말) | 이상·수량·증빙 보고 | 대상 로트·사유 확인 |\n| 2 | 품질 담당 | QLT(품질 격리)·격리 처리 | 판매·피킹·출고 제외 |\n| 3 | 품질·공급사 | 재검수·처분 협의 | 해제·반품·폐기 결정 |\n| 4 | 승인자 | DSP(폐기) 또는 반품 처리 검토 | 승인 조건·대상 확인 |\n| 5 | 현장 작업자 | 실제 반출·폐기 확인 | 승인과 실행 구분 |\n| 6 | 시스템·정산 | 실제 결과 반영 | 현물 차감·매입 조건 별도 판단 |\n\n## 문제 발생 시 지침\n| 발생 상황 | 즉시 조치 | 확인·후속 처리 | 재개·완료 조건 |\n|---|---|---|---|\n| 격리품 피킹 시도 | 피킹·출고 차단 | 품질 상태 확인 | 재검수 적합·격리 해제 |\n| 처분 방식 미확정 | 판매 제외·현물 유지 | 공급사·품질 담당 협의 | 반품·폐기 방식 결정 |\n| 폐기 미승인 | 실행 보류 | 권한·금액·수량 기준 검토 | 필요한 승인 완료 |\n| 승인됐지만 미실행 | 현물수량 유지 | 실제 실행 확인 | 실행 결과 기록 후 차감 |\n| 폐기 중복 요청 | 같은 DSP(폐기)·요청 결과 확인 | 기존 반영 기록 조회 | 재차감 없이 결과 반환 |\n\n즉시 반송·증빙·소비기한·추가 승인 기준은 아래 정책 선택 참조.\n\n## 상세 기능·규칙\n\n### 책임\n- 판매 가능 여부 판단.\n- 격리·재검수·반품·폐기 결정과 처리 근거 관리.\n\n### 격리\n- 파손·품질미달·소비기한 문제 등록.\n- 상품·로트·수량·위치·사유 기록.\n- 사진·검수 근거 연결.\n- 격리품 피킹·출고 차단.\n- 실제 반품·폐기 전까지 현물수량 유지.\n\n### 재검수·격리 해제\n- 품질담당 재검수.\n- 결과·담당자·처리시각 기록.\n- 적합 판정 후 격리 해제·판매 재개.\n- 반품 전용 재고는 판매 재개 대상에서 제외.\n\n### 반품\n- 공급사와 반품 협의.\n- 대상·수량·사유·증빙 기록.\n- 반품 승인과 실제 반출 구분 권장.\n- 실제 반출 결과를 재고·정산에 전달.\n\n### 폐기\n1. 폐기요청·사유·수량 등록.\n2. 권한자 검토·승인.\n3. 실제 폐기 처리.\n4. 재고 차감·이력 보존.\n- 중복 확정 방지.\n- 승인만으로 실물 재고 차감하지 않음.\n\n## 추가 확인·미결정 정책\n- 격리보관 또는 즉시 반송.\n- 정상 건 포함 촬영 또는 이상 건만 촬영.\n- 상품군별 판매 가능 소비기한.\n- 품질 부적합은 판매 제외. 적합한 기한 임박품의 안내·할인·동의 기준은 별도 확인.\n- B마트 OMS(주문·출고 관리)·쿠팡 사례에서 마감할인 확인. 우리 할인 대상·수량·율·승인 조건은 미정.\n- 폐기 승인 1인 또는 수량·금액별 추가 승인.\n\n### 주요 데이터·화면\n- 품질사건·격리·재검수·반품·폐기요청·승인·처리결과.\n- 관리자 웹: 품질 검토·격리해제·반품 협의·폐기 승인.\n- PDA(현장 작업 단말): 문제 보고·격리 위치 기록·반품·폐기 실행 확인.\n\n## 문서·식별자 및 연결 규칙\n- `QLT`(품질 격리): 품질 격리 건 등록 시 생성.\n- `RTV`(공급사 반품): 공급사 반품 건 최초 저장 시 생성. 원입고·대상 상품행 연결.\n- `DSP`(폐기): 폐기요청 생성 시 발급.\n- 폐기 요청·승인·실행은 같은 DSP(폐기)의 상태·이력으로 관리.\n- 격리·처분 대상 상품·로트·수량·근거 문서 연결.\n- 번호 생성·승인만으로 재고 차감 금지. 실제 처리·반영 기록 확인.\n\n\n## 관련 정의\n- [사용자 채번](00_ERP·WMS%20업무%20문서%20채번%20지침.md)\n- [실사례 우선 운영정책](12_운영정책_지침안.md)\n- [센터·구역·공통 웹](00_DC_PPC_구역_위치번호_운영웹.md)\n","06_작업배정.md":"# 작업배정\n\n## 적용 범위·근거\n- 쿠팡 작업자·경로 안내 확인. B마트 로케이션 할당과 작업자 배정은 별개. 교대·오프라인 세부는 프로젝트 설계.\n- 아래 단계·대응표는 프로젝트 흐름. 업체 SOP(표준 업무 절차)로 확인된 범위는 [실사례 조사](14_미정정책_쿠팡_B마트_실사례조사.md) 참조.\n\n## 업무 흐름\n```text\n직무·권한 확인 → 작업 배정 → 시작 요청 → 진행·문제 보고 → 업무 확정 → 완료\n                                             지연·교대 → 인계·재배정 → 같은 TSK(작업 식별자)로 계속\n```\n\n## 단계별 처리\n| 순서 | 담당·화면 | 처리 | 확인·결과 |\n|---|---|---|---|\n| 1 | 관리자 웹 | 직무·대상 업무·작업자 지정 | TSK(작업 식별자)·업무문서 연결 |\n| 2 | PDA(현장 작업 단말) | 작업 시작 요청 | 동시 시작 하나만 허용 |\n| 3 | PDA(현장 작업 단말) | 진행·문제 보고 | 완료분·잔여분 기록 |\n| 4 | 관리자 웹 | 지연 확인·인계·재배정 | TSK(작업 식별자) 유지·담당자 이력 보존 |\n| 5 | 업무 도메인 | 실제 업무 완료 검증 | 재고 등은 해당 업무에서 확정 |\n\n## 문제 발생 시 지침\n| 발생 상황 | 즉시 조치 | 확인·후속 처리 | 재개·완료 조건 |\n|---|---|---|---|\n| 두 작업자 동시 시작 | 한 요청만 수락 | 현재 담당·시작 상태 조회 | 유효 담당자만 진행 |\n| 작업 지연·교대 | 진행분·잔여분 확인 | 관리자 인계·재배정 | 신규 담당자 확인 |\n| 이전 담당자의 늦은 스캔 | 자동 반영 제한 | 담당 변경·요청 시점 검토 | 관리자 판단·유효 요청 확인 |\n| 권한 없는 취소·예외처리 | 처리 차단 | 권한자에게 요청 | 승인 권한 확인 |\n\n담당 변경 버전으로 늦은 요청 식별은 설계 제안.\n\n## 상세 기능·규칙\n\n### 책임\n- 작업 담당자·진행상태·인계 관리.\n- 실제 업무 완료·수량 확정은 각 업무 도메인에서 판단.\n\n### 배정\n- 직원코드·당일 직무 기준 화면·권한 설정.\n- 적치·보충·피킹 등 작업 배정.\n- 작업별 대상 상품·수량·출발·목적지 제공.\n- 주문·토트별 담당 작업자 지정.\n- 같은 작업의 동시 시작은 하나만 허용.\n\n### 자동화 범위 구분\n| 대상 | 확인된 실사례 | 프로젝트 적용 |\n|---|---|---|\n| 재고 위치 할당 | B마트 센터 간 이동에서 자동·관리자 수동 할당 | 출발 위치·수량 할당. 작업자 배정과 별도 처리 |\n| 작업자·작업 경로 | 쿠팡 WMS(창고·재고 관리)에서 작업자·경로 안내 | 직무·근무 여부·현재 작업을 반영하는 배정 기능 설계 |\n| 보충 작업 생성 | 공개 자료로 이 프로젝트의 최소재고 기준은 확인되지 않음 | 상품·위치별 보충 기준을 별도 결정 |\n| 교대·재배정 | 업체의 상세 인계 규칙은 미확인 | 완료분·잔여분·담당 변경 이력을 보존하는 설계 |\n\n### 진행 관리\n- 작업 대기·진행·완료·지연 현황 조회.\n- 관리자에게 담당자·진행도 제공.\n- 문제·차이 보고 연결.\n- 작업취소·예외처리는 권한자 확인.\n\n### 인계·재배정\n- 지연 작업 재배정.\n- 교대 시 작업 인계.\n- 완료분·잔여분·스캔 이력 인계.\n- 이전 작업자의 늦은 요청 통제.\n- 충돌 발생 시 관리자 검토.\n- 배정·시작·인계·취소 이력 보존.\n- 제안: 담당자 변경 버전으로 오래된 요청 식별.\n\n### 주요 데이터·화면\n- 작업·담당자·직무·진행상태·인계·재배정 이력.\n- 관리자 웹: 작업현황·배정·취소·인계·재배정.\n- PDA(현장 작업 단말): 내 작업·시작·진행·문제 보고·완료.\n\n## 추가 확인·미결정 정책\n- 자동 배정과 수동 배정 범위.\n- 지연 판정 시간.\n- 취소·인계 가능 권한.\n\n## 문서·식별자 및 연결 규칙\n- 작업 식별자 `TSK-YYYYMMDD-6자리 일련번호` 사용.\n- 교대·인계·재배정 후에도 TSK(작업 식별자) 유지.\n- TSK(작업 식별자)와 대상 업무문서 PO(구매발주)·RCV(입고·검수)·MOV(센터 내부 이동·적치·보충)·SHP(출하) 등을 별도 연결.\n- 작업 담당자 변경은 이력·버전으로 관리. 새 번호로 기존 작업 대체하지 않음.\n- 스캔 요청은 단말 UUID(중복 방지용 고유 요청번호) 생성·재전송 시 유지.\n\n\n## 관련 정의\n- [사용자 채번](00_ERP·WMS%20업무%20문서%20채번%20지침.md)\n- [실사례 우선 운영정책](12_운영정책_지침안.md)\n- [센터·구역·공통 웹](00_DC_PPC_구역_위치번호_운영웹.md)\n","07_주문이행_피킹.md":"# 주문이행·피킹\n\n## 적용 범위·근거\n- B마트 Shipment·예정재고 예약 판매·부하 기반 출고 확인. 피킹 결품 대체·무응답 규칙은 미확인.\n- 아래 단계·대응표는 프로젝트 흐름. 업체 SOP(표준 업무 절차)로 확인된 범위는 [실사례 조사](14_미정정책_쿠팡_B마트_실사례조사.md) 참조.\n\n## 업무 흐름\n```text\nORD(고객 주문) → SHP(출하) 생성 → 현재·예정·할당 재고 확인 → 출고 요청 → TSK(작업 식별자)·토트 배정 → 피킹\n                                                    ├─ 정상 → 포장\n                                                    └─ 결품 EXC(결품·대체 처리) → 고객 확인\n                                                                  ├─ 대체 → 변경 후 피킹\n                                                                  ├─ 부분·전체취소 OCN(고객 주문 취소) → 필요 시 RFD(환불)\n                                                                  └─ 연락 불가 → 정책별 보류·이관\n```\n\n## 단계별 처리\n| 순서 | 담당·화면 | 처리 | 확인·결과 |\n|---|---|---|---|\n| 1 | 고객 앱·시스템 | 주문·예약 접수 | 상품 재고·시간대 여력 각각 확인 |\n| 2 | 관리자·시스템 | 작업자·토트 배정 | ORD(고객 주문)·TSK(작업 식별자)·TOTE(재사용 운반 용기) 사용 이력 |\n| 3 | PDA(현장 작업 단말) | 토트·위치·상품 스캔 | 오집품·혼입 방지 |\n| 4 | PDA(현장 작업 단말)·고객·지원팀 | 결품 EXC(결품·대체 처리)·고객 선택 | 동의·대체·취소 기록 |\n| 5 | 주문 시스템 | 주문 변경 확정 | OCN(고객 주문 취소)·RFD(환불) 및 대상 행 연결 |\n| 6 | PDA(현장 작업 단말) | 유효 주문 기준 작업 마무리 | 완료수량·잔여수량 확인 |\n\n## 문제 발생 시 지침\n| 발생 상황 | 즉시 조치 | 확인·후속 처리 | 재개·완료 조건 |\n|---|---|---|---|\n| 다른 주문 토트·상품 | 혼입 차단 | 주문·토트·상품 재확인 | 지정 대상 일치 |\n| 결품 | 부족수량 기록·EXC(결품·대체 처리) 생성 | 고객에게 대체·취소 확인 | 고객 결정·주문 변경 확정 |\n| 고객 연락 불가 | 임의 결정 금지 | 정책에 따라 보류·지원팀 이관 | 고객 확인 또는 정해진 정책 처리 |\n| 예약 여력 부족 | 가능 슬롯과 재고 별도 확인 | 다른 시간 선택 안내 권장 | 접수 가능한 시간·재고 확인 |\n| 대체상품 선택 | 원주문대로 임의 피킹 금지 | 품목·수량·동의 기록 | 변경 확정 후 피킹 |\n\n재고 예약·자동 배정·예약 용량 제한 구현은 제안. 고객 시스템 처리와 연결.\n\n## 상세 기능·규칙\n\n### 책임\n- 고객 주문을 실제 출고 상품으로 준비.\n- 결품 발견·고객 선택·작업 변경 연결.\n\n### 준비·피킹\n- 주문·상품·수량 확인.\n- 제안: 주문별 재고 예약.\n- 작업자·토트 배정.\n- 토트·위치·상품 스캔.\n- 다른 주문 상품의 토트 혼입 차단.\n- 피킹수량·완료수량 기록.\n- 위치의 수량 부족·분실 보고.\n- 다른 작업자의 동시 작업 방지.\n\n### 결품\n1. 결품 상품·수량 보고.\n2. 고객 의사 확인.\n3. 결품 수량만 취소 / 대체상품 / 전체취소 선택.\n4. 주문 변경 확정.\n5. 피킹 대상·재고 예약 갱신 제안.\n- 대체 품목·수량·고객 동의 기록.\n- 연락 불가 시 임의 확정 금지.\n- 정책에 따라 출하 보류·지원팀 이관·부분환불.\n- 고객 주문·환불 처리는 고객 주문 시스템과 연계.\n\n### 예약 주문\n- 고객이 가능한 시간대 선택.\n- 관리자: 시간대별 작업 가능량·접수량 확인.\n- 시간대 여력과 상품 재고 각각 확인.\n- 품질 보존 분산 구간·현장 여유에 따라 피킹 요청. 고객 수령시간과 작업 시작시각 구분.\n- 인계 전 적정 온도 보관.\n\n### 예약 스케줄·재고 부족\n- 출고요청과 배달요청 분리. 입고 상태·현장 여유에 따라 요청 시점 제어.\n- 예정 물량 부족 시 우선 SKIP·배송 가능한 마지막 시점에 요청하는 B마트 사례.\n- 마지막 시점에도 부족할 때 최종 연락·취소는 미확인. 피킹 결품 EXC(결품·대체 처리)와 구분.\n- 슬롯 판매 상한과 현장 작업 처리량은 별개.\n\n### 주요 데이터·화면\n- 이행주문·피킹항목·토트·결품·대체내역·예약시간.\n- PDA(현장 작업 단말): 배정 작업·토트 스캔·피킹·결품 보고.\n- 관리자 웹: 주문 진행·결품 검토·보류·예약 용량 관리.\n- 고객 앱: 결품 선택·대체 동의·예약시간 선택.\n\n## 추가 확인·미결정 정책\n- 고객 연락 불가 시 대기시간·후속 처리.\n- 대체상품 선정·금액 차이 처리.\n- 시간대별 처리 용량·접수 마감.\n\n## 문서·식별자 및 연결 규칙\n- `ORD`(고객 주문): 고객 주문 최초 저장 시 생성.\n- `EXC`(결품·대체 처리): 결품·대체 등 고객 결정이 필요한 건 생성 시 발급.\n- `OCN`(고객 주문 취소): 전체·부분 주문 취소요청 생성 시 발급.\n- `RFD`(환불): 환불요청 생성 시 발급. 취소·환불 상태는 별도 관리.\n- EXC(결품·대체 처리)·OCN(고객 주문 취소)·RFD(환불)는 ORD(고객 주문)·대상 상품행까지 연결.\n- 피킹 작업 TSK(작업 식별자)와 토트 TOTE(재사용 운반 용기)는 주문번호와 분리.\n- 토트는 재사용 가능. 주문별 사용 시작·종료 이력 보존.\n- 고객 주문 시스템 연계 시 외부 번호·출처와 내부 식별자를 연결.\n\n\n## 관련 정의\n- [사용자 채번](00_ERP·WMS%20업무%20문서%20채번%20지침.md)\n- [실사례 우선 운영정책](12_운영정책_지침안.md)\n- [센터·구역·공통 웹](00_DC_PPC_구역_위치번호_운영웹.md)\n","08_포장_출고.md":"# 포장·출고\n\n## 적용 범위·근거\n- B마트 보냉·포장 후 대기 사례 확인. PKG(실물 포장 식별자) 교체는 사용자 정의. 양사 재고원장 차감 시점 미확인.\n- 아래 단계·대응표는 프로젝트 흐름. 업체 SOP(표준 업무 절차)로 확인된 범위는 [실사례 조사](14_미정정책_쿠팡_B마트_실사례조사.md) 참조.\n\n## 업무 흐름\n```text\nORD(고객 주문) → SHP(출하) 생성·출고 요청 → 피킹 완료 → 온도별 포장·PKG(실물 포장 식별자) 생성 → 스캔·포장완료 → 출고 확인 → 인계대기\n                                  훼손 → 포장 교체·새 PKG(실물 포장 식별자) → 기존 PKG(실물 포장 식별자) 무효·교체 관계 기록\n                                  재출력만 필요 → 같은 PKG(실물 포장 식별자) 유지·출력 이력\n```\n\n## 단계별 처리\n| 순서 | 담당·화면 | 처리 | 확인·결과 |\n|---|---|---|---|\n| 1 | PDA(현장 작업 단말)·시스템 | 주문·피킹·SHP(출하) 확인 | 유효 상품·출하 단위 확인 |\n| 2 | 포장 작업자 | 온도별 분리·포장 | 실물별 PKG(실물 포장 식별자) 생성 |\n| 3 | PDA(현장 작업 단말) | 라벨 부착·스캔 | PKG(실물 포장 식별자)·주문·구성 확인 |\n| 4 | PDA(현장 작업 단말) | 전체 포장완료·출고 확인 | 누락·혼입 검증 |\n| 5 | 인계 담당 | 유효 PKG(실물 포장 식별자) 전달 | HOV(기사 인계)로 인계 연결 |\n\n## 문제 발생 시 지침\n| 발생 상황 | 즉시 조치 | 확인·후속 처리 | 재개·완료 조건 |\n|---|---|---|---|\n| 포장 훼손 | 상태 확인·재포장 | 새 PKG(실물 포장 식별자) 생성·이전 PKG(실물 포장 식별자) 무효 | 교체 관계·유효 포장 확인 |\n| 라벨 재출력 | 실물 교체 여부 확인 | 같은 PKG(실물 포장 식별자) 재출력·이력 기록 | 읽을 수 있는 유효 라벨 |\n| 다른 주문 포장 스캔 | 처리 차단 | SHP(출하)·ORD(고객 주문)·PKG(실물 포장 식별자) 대조 | 올바른 패키지 확인 |\n| 패키지 누락 | 전체 완료 처리 보류 | 유효 PKG(실물 포장 식별자) 목록·실물 확인 | 모든 대상 확인 |\n| 재고 차감 시점 불명확 | 별도 단계마다 반복 차감 금지 | 운영 기준 확인 | 정한 한 시점에서만 반영 |\n\n## 상세 기능·규칙\n\n### 책임\n- 피킹된 상품을 주문별 패키지로 구성.\n- 패키지 누락·혼입 방지·출고 준비 확정.\n\n### 포장\n1. 주문·상품·피킹 결과 확인.\n2. 신선·냉장·냉동 등 조건별 포장 분리.\n3. 실물 포장별 PKG(실물 포장 식별자) 생성·라벨 발급·부착.\n4. 라벨 스캔·포장완료 처리.\n- 한 주문에 여러 패키지 허용.\n- 전체 패키지 구성·수량 기록.\n- 포장 분리 고객 안내는 제안.\n\n### 훼손·재포장\n- 훼손 포장재 처리.\n- 상품 상태 확인·재포장.\n- 실제 포장 교체 시 새 PKG(실물 포장 식별자)·라벨 발급.\n- 기존 PKG(실물 포장 식별자) 무효 처리·새 PKG(실물 포장 식별자)와 교체 관계 기록.\n\n### 대기·배차\n- 목포 사례: 계절별 보냉제·배달 시작 전 냉장 대기. 모든 상품 동일 온도 적용 금지.\n- 우리 상품별 보관온도·최대 대기시간은 검증 후 등록.\n- 출고 준비와 배차 병행 가능. 예상 준비시각 전달.\n- 차감사건은 정책 확정 후 한 번만 반영.\n\n### 출고\n- 주문·패키지 일치 확인.\n- 다른 주문 패키지 혼입 차단.\n- 누락 패키지 확인.\n- 출고·인계대기 상태 기록.\n- 기사 인계 결과 수신.\n- 모든 패키지 전달 후 인계완료.\n\n### 주요 데이터·화면\n- 패키지·포장조건·라벨·재포장 이력·출고기록.\n- PDA(현장 작업 단말): 주문 확인·포장·라벨 스캔·재포장·출고 확인.\n- 관리자 웹: 포장·출고현황·누락·예외 검토.\n- 고객 앱 연계: 포장 분리·출고 상태 안내.\n\n## 추가 확인·미결정 정책\n- 포장완료·픽업준비완료·인계·원장 반영을 별도 기록. 우리 출고완료 상태 정의는 미정.\n- 포장완료·출고확정·기사 인계·재고원장 반영을 별도 사건으로 기록. 원장 차감 시점은 미결정 정책이며, 확정 시 중복 차감을 방지.\n- 포장 분리 안내 범위.\n\n## 문서·식별자 및 연결 규칙\n- `SHP`(출하): 고객 출하 단위 생성 시 발급. ORD(고객 주문)·출하 대상 상품행 연결.\n- `PKG`(실물 포장 식별자): 실물 포장별 고유 번호. SHP(출하)와 연결.\n- 라벨의 `1/3`은 표시 순번. 포장·인계 검증은 PKG(실물 포장 식별자)로 수행.\n- 실제 포장 교체: 새 PKG(실물 포장 식별자) 생성·기존 PKG(실물 포장 식별자) 무효·교체 관계 보존.\n- 동일 포장 라벨 재출력: PKG(실물 포장 식별자) 유지·출력 이력 기록.\n- 인계 대상은 유효 PKG(실물 포장 식별자)만 집계. 교체 전 포장 중복 집계 금지.\n\n\n## 관련 정의\n- [사용자 채번](00_ERP·WMS%20업무%20문서%20채번%20지침.md)\n- [실사례 우선 운영정책](12_운영정책_지침안.md)\n- [센터·구역·공통 웹](00_DC_PPC_구역_위치번호_운영웹.md)\n","09_운송_인계.md":"# 운송·인계\n\n## 적용 범위·근거\n- B마트 DC(중앙 물류센터)→PPC(피킹·포장센터) 이관·할당/취소 통제 확인. TRF(센터 간 이송)·TOUT(이송 출발)·TIN(이송 도착)·HOV(기사 인계)와 잔량 처리 세부는 프로젝트 규칙.\n- 아래 단계·대응표는 프로젝트 흐름. 업체 SOP(표준 업무 절차)로 확인된 범위는 [실사례 조사](14_미정정책_쿠팡_B마트_실사례조사.md) 참조.\n\n## 업무 흐름\n```text\n센터 이송: TRF(센터 간 이송) 지시 → 재고 로케이션 할당 → TOUT(이송 출발) 출발 → 이동중 → 실제 도착별 TIN(이송 도착) → 잔량 확인 → 완료\n기사 인계: 배차 → HOV(기사 인계) 생성 → 기사·SHP(출하)·유효 PKG(실물 포장 식별자) 확인 → 전체 전달 → 인계완료\n```\n\n## 단계별 처리\n| 순서 | 담당·화면 | 처리 | 확인·결과 |\n|---|---|---|---|\n| 1 | 관리자 웹 | TRF(센터 간 이송)·배차 지정 | 출발·도착센터·상품·수량 |\n| 2 | 출발 PDA(현장 작업 단말) | TOUT(이송 출발) 출발 확인·확정 | 출발 감소·이동중 증가 |\n| 3 | 도착 PDA(현장 작업 단말) | 실제 도착별 TIN(이송 도착) 생성·확정 | 도착분만 반영·잔량 유지 |\n| 4 | 관리자 웹 | 잔량 조사·마감 | 추가 도착 또는 승인 조정 |\n| 5 | 현장·기사 앱 | HOV(기사 인계)·기사·PKG(실물 포장 식별자) 대조 | 다른 기사·주문 차단 |\n| 6 | 인계 담당·기사 | 전체 전달 확인 | HOV(기사 인계) 완료·증빙 보존 |\n\n## 문제 발생 시 지침\n| 발생 상황 | 즉시 조치 | 확인·후속 처리 | 재개·완료 조건 |\n|---|---|---|---|\n| 12병 출발·10병 도착 | TIN(이송 도착) 10병만 반영·2병 이동중 유지 | 차량·상하차·파손 조사 | 추가 TIN(이송 도착) 또는 승인 조정 |\n| 도착 후 추가 물량 | 기존 TIN(이송 도착) 덮어쓰기 금지 | 새 실제 도착 건 TIN(이송 도착) 생성 | 잔량 감소·결과 확인 |\n| 잘못된 기사·패키지 | 인계 차단 | 기사·SHP(출하)·PKG(실물 포장 식별자) 대조 | 배정·대상 일치 |\n| 일부 패키지 미전달 | 인계완료 보류 | 미전달 유효 PKG(실물 포장 식별자) 확인 | 전체 전달 |\n| 배송 지연 | 보고·품질·온도 점검 | 보관 복귀·일정 변경·고객 안내 | 품질 기준·운영 판단 충족 |\n\n## 상세 기능·규칙\n\n### 책임\n- 센터 간 운송·기사 인계 관리.\n- 출발·도착·미도착 수량과 인계 증빙 보존.\n\n### 센터 간 이송\n1. 출발센터·도착센터·상품·로트·수량 등록.\n2. 출발 확정·출발센터 수량 감소.\n3. 이동중 수량 관리.\n4. 도착센터 실제 수량 확인.\n5. 도착 확정·도착센터 수량 증가.\n- 운송 도메인은 출발·도착 사실 관리.\n- 재고 도메인은 각 위치·이동중 수량 반영.\n\n### 이관 할당·취소\n- 공개 B마트 사례: 미할당 → 부분할당/할당. 자동·관리자 수동 위치 할당.\n- 사례의 취소는 미할당 상태만 허용. 우리 TRF(센터 간 이송)에도 할당 상태·SKU(상품 코드)별 확보량 연결.\n- 할당·취소 동시 반영 방지. 이미 확보·상차·출발한 물량은 취소 버튼만으로 원복 금지.\n- 할당 해제·운송 회수 절차는 별도 정의. 작업자 배정·선반 보충과 구분.\n\n### 부분 도착·차이\n- 예: 12병 출발, 10병 도착 → 2병 이동중 유지.\n- 부족분을 즉시 폐기·유실로 확정하지 않음.\n- 차량 내부·상하차·파손 여부 조사.\n- 추가 도착 또는 승인된 조정으로 잔량 처리.\n- 출발·도착 중복 확정 방지.\n\n### 기사 인계\n- 센터 이송차량과 고객 배달 라이더 배정 구분. 배달 요청은 출고 준비와 병행 가능.\n- 주문·기사·패키지 일치 확인.\n- 잘못된 기사·다른 주문 패키지 인계 차단.\n- 패키지별 스캔·전달 확인.\n- 전체 전달 후 인계완료.\n- 담당자·기사·시각·증빙 기록.\n\n### 배송 지연\n- 지연 보고·상품 품질·온도 점검.\n- 필요 시 안전한 보관장소로 복귀.\n- 품질 기준에 따라 배송 가능 여부 판단.\n- 고객에게 시간 변경 안내.\n- 원문의 '품질기준 변경' 의미는 확인 필요. 임의 기준 완화로 해석하지 않음.\n\n### 주요 데이터·화면\n- 이송·출발·도착·이동중 잔량·배차·인계·지연보고.\n- 관리자 웹: 이송·배차·인계현황·미도착 조사.\n- PDA(현장 작업 단말): 출발·도착 확인·패키지 인계.\n- 기사 앱/PDA(현장 작업 단말): 배정 확인·인계 확인·지연 보고.\n\n## 추가 확인·미결정 정책\n- 인계 스캔만 기록 또는 사진 추가.\n- 미도착 조사·조정 승인 기준.\n- 지연 시 복귀·재배송 기준.\n\n## 문서·식별자 및 연결 규칙\n- `TRF`(센터 간 이송): 센터 이송 지시 생성 시 발급.\n- `TOUT`(이송 출발): 이송 출발 건 생성 시 발급·TRF(센터 간 이송) 연결.\n- `TIN`(이송 도착): 실제 도착 건마다 생성·TRF(센터 간 이송) 및 대응 출발 건 연결.\n- 부분 도착마다 새 TIN(이송 도착) 생성. 기존 도착수량 덮어쓰기 금지.\n- TRF(센터 간 이송) 12병 → TOUT(이송 출발) 12병 → TIN(이송 도착) 10병 → 이동중 2병 → 추가 TIN(이송 도착) 2병.\n- 입력 오류는 원기록 보존·별도 정정 이력 처리.\n- `HOV`(기사 인계): 출하 인계 건 생성 시 발급·SHP(출하)·기사·유효 PKG(실물 포장 식별자) 연결.\n- 인계 검증은 PKG(실물 포장 식별자) 기준. 모든 대상 전달 여부는 HOV(기사 인계) 상태·이력으로 관리.\n\n\n## 관련 정의\n- [사용자 채번](00_ERP·WMS%20업무%20문서%20채번%20지침.md)\n- [실사례 우선 운영정책](12_운영정책_지침안.md)\n- [센터·구역·공통 웹](00_DC_PPC_구역_위치번호_운영웹.md)\n","10_매입_정산.md":"# 매입·정산\n\n## 적용 범위·근거\n- 매입 인정은 공급사 계약 확인 필요. 위탁 로켓그로스 약관을 직매입 정산 규칙으로 전용하지 않음.\n- 아래 단계·대응표는 프로젝트 흐름. 업체 SOP(표준 업무 절차)로 확인된 범위는 [실사례 조사](14_미정정책_쿠팡_B마트_실사례조사.md) 참조.\n\n## 업무 흐름\n```text\n검수 결과·계약 확인 → 매입 인정 수량·금액 산정 → PUR(매입확정) 저장 → 검토·확정\n                             이상 → 자동 결제 확정 보류 → 공급사 협의 → 금액 결정\n확정 후 차감·추가 발생 → PJA(매입 조정) 생성·원 PUR(매입확정) 연결 → 조정 확정\n```\n\n## 단계별 처리\n| 순서 | 담당·화면 | 처리 | 확인·결과 |\n|---|---|---|---|\n| 1 | 정산 담당 | 발주·입고·반품·계약 확인 | 원문서·대상 상품행 연결 |\n| 2 | 정산·공급사 | 인정수량·금액 협의 | 실물과 매입 인정 구분 |\n| 3 | 관리자 웹 | PUR(매입확정) 최초 저장·검토 | 번호 발급은 확정 아님 |\n| 4 | 권한자·시스템 | 확정·반영 | 확정 상태·반영 기록 보존 |\n| 5 | 정산 담당 | 확정 후 변경 PJA(매입 조정) | 원 PUR(매입확정) 보존·조정 근거 기록 |\n\n## 문제 발생 시 지침\n| 발생 상황 | 즉시 조치 | 확인·후속 처리 | 재개·완료 조건 |\n|---|---|---|---|\n| 파손·부족·초과 | 자동 결제 확정 보류 | 계약·검수·공급사 협의 확인 | 인정수량·금액 결정 |\n| 폐기 발생 | 자동 비용 차감으로 단정 금지 | 비용 부담·계약 조건 확인 | 정산 인정 기준 확정 |\n| PUR(매입확정) 확정 후 금액 변경 | 원 PUR(매입확정) 덮어쓰기 금지 | PJA(매입 조정)·조정 또는 역처리 근거 | 조정 검토·확정 |\n| 정산 요청 재전송 | 반영 기록 조회 | 같은 요청 결과 반환 | 한 번만 반영 |\n\n## 상세 기능·규칙\n\n### 책임\n- 검수·계약·공급사 협의를 기준으로 매입금액 결정.\n- 재고수량과 청구·지급금액 구분.\n\n### 매입 인정\n- PO(구매발주)·ASN(공급사 납품예정)·RCV(입고·검수)·검수 연결. DC(중앙 물류센터)→PPC(피킹·포장센터) TIN(이송 도착)은 내부 이관이며 같은 물량 매입 중복 생성 금지.\n- 도착·정상·파손·미납품 수량 확인.\n- 계약 기준으로 매입 인정 수량 산정.\n- 원문 검토안: 정상 검수 기준 인정. 실제 금액 차감·비용 부담은 계약 확인.\n- 예외안: 공급사 협의로 전체금액 인정.\n- 파손 허용률 미확정. 숫자 기본값 없이 계약·승인 근거 기록.\n\n### 예외 정산\n- 수량 차이·파손 발생 시 자동 결제 확정 보류.\n- 공급사 협의 결과·증빙 기록.\n- 반품·폐기·추가발주 결과 반영.\n- 청구금액 확정·조정 이력 보존.\n- 폐기만으로 비용 차감 여부를 자동 결정하지 않음.\n\n### 예시\n- 90병 도착, 정상 88병·파손 2병.\n- 현물은 처리 전 90병, 판매가능은 예약·기한 제한이 없다면 88병.\n- 매입 인정은 계약에 따라 88병 또는 90병 등 별도 결정.\n\n### 주요 데이터·화면\n- 매입내역·청구서·인정수량·조정금액·협의·승인.\n- 관리자 웹: 매입 검토·예외 협의·정산 확정.\n- 공급사 포털: 청구·정산 확인·협의 응답.\n\n## 추가 확인·미결정 정책\n- 파손 허용 비율·비용 부담.\n- 반품·폐기 비용 인정 조건.\n- 정산 승인·지급 기준.\n- 세무·회계 전표 상세 처리는 원문 범위 밖. 추가 설계 필요.\n\n## 문서·식별자 및 연결 규칙\n- `PUR`(매입확정): 매입 인정 건 최초 저장 시 발급.\n- `PJA`(매입 조정): 확정 후 차감·추가 조정 시 발급·원 PUR(매입확정) 연결.\n- 매입·반품·조정은 원문서와 대상 상품행까지 연결.\n- PUR(매입확정) 번호 생성만으로 매입 확정·지급 처리 금지.\n- 매입 반영은 확정 상태·반영 기록 기준. 재전송 시 중복 반영 차단.\n- 확정 후 원 PUR(매입확정) 보존. PJA(매입 조정) 등 조정·역처리 근거 기록.\n- 업무 발생일·문서 생성일·승인일·회계 귀속일 구분.\n\n\n## 관련 정의\n- [사용자 채번](00_ERP·WMS%20업무%20문서%20채번%20지침.md)\n- [실사례 우선 운영정책](12_운영정책_지침안.md)\n- [센터·구역·공통 웹](00_DC_PPC_구역_위치번호_운영웹.md)\n","11_최종_웹앱_기능흐름.md":"# 최종 웹·앱 기능 흐름\n\n## 1. 적용 범위\n- DC(중앙 물류센터)·PPC(피킹·포장센터) 역할·예약·작업 분산은 공개 사례 우선 반영.\n- 메뉴·공통 웹·승인 화면·번호는 프로젝트 구성. 실제 업체 UI 아님.\n- 업체 확인범위는 [조사](14_미정정책_쿠팡_B마트_실사례조사.md), 미결정 기준은 [정책](12_운영정책_지침안.md) 참조.\n\n## 2. 서비스·권한\n| 서비스 | 첫 화면·메뉴 |\n|---|---|\n| 본사 운영 웹 | 전체 재고·센터·이관·지연·예외 관제 |\n| DC(중앙 물류센터) 운영 웹 | 공급사 입고·보관·PPC(피킹·포장센터) 보충요청·할당·상차 |\n| PPC(피킹·포장센터) 운영 웹 | 이관 도착·재고·주문·예약·피킹·포장·인계 |\n| 품질·정산 역할 | 품질 검토·처분·매입·조정 등 허용 업무 |\n| 공급사 포털 | 입점·상품등록 신청·발주 확인·ASN(공급사 납품예정)·변경 협의·정산 |\n| 현장 PDA(현장 작업 단말) | 내 작업·스캔·계수·문제보고·전송상태 |\n| 기사 기능 | 이송 또는 배달 배정·인계·지연 |\n| 고객 앱 연계 | 상품·배송약속·예약·주문 변경 안내 |\n\n```text\n로그인 → 접근센터 확인 → 작업센터 선택 → 당일 직무·행위권한 확인 → 내 업무\n```\n- DC(중앙 물류센터)·PPC(피킹·포장센터)는 한 운영 웹 안에 다른 대시보드 제공 권고.\n- PDA(현장 작업 단말)·관리자 화면 통합 여부는 기존 검토 유지. 승인 권한은 별도.\n- 메뉴 표시와 서버 권한 검증 모두 필요. 상대센터 전체 조회 권한 자동 부여 금지.\n\n## 3. 단계별 화면 연결\n| 단계 | 화면·담당 | 처리·문서 | 다음 단계 | 문제 지침 |\n|---|---|---|---|---|\n| 1 | 상품·공급사 | 공급사·상품등록 신청·단위 검토 | 발주 | 기준정보 확인 후 진행 |\n| 2 | 관리자 발주 | PO(구매발주)·수량·센터 지정 | 공급사 확인 | 변경 PCH(발주 변경 요청)·잔량 PCN(발주 잔량 취소) |\n| 3 | 공급사 포털 | 수락·ASN(공급사 납품예정) 등록 | DC(중앙 물류센터) 입고예정 | 납기·초과·잔량 협의 |\n| 4 | DC(중앙 물류센터) PDA(현장 작업 단말) | RCV(입고·검수)·실수량·품질·기한 검수 | 보관·품질·매입 | 정상/보류 분리·근거 기록 |\n| 5 | DC(중앙 물류센터) 재고·이관 | TRF(센터 간 이송)·로케이션 할당 | 집품·상차 | 미할당·부분할당·할당 구분 |\n| 6 | DC(중앙 물류센터) 출발·운송 | TOUT(이송 출발)·실제 출발 | PPC(피킹·포장센터) 도착 | 출발·이동중 추적 |\n| 7 | PPC(피킹·포장센터) PDA(현장 작업 단말) | 실제 도착 TIN(이송 도착)·품질 확인 | 적치·판매 준비 | 미도착 잔량 조사 |\n| 8 | 고객·OMS(주문·출고 관리) 연계 | ORD(고객 주문)·SHP(출하)·현재/예정/할당 재고 | 출고 요청 | 예약 약속·현물 구분 |\n| 9 | 주문·작업 관제 | 현장 여유·품질 구간·TSK(작업 식별자) | PDA(현장 작업 단말) 피킹 | 예정재고 부족 스케줄 보류 |\n| 10 | PPC(피킹·포장센터) 피킹 | 토트·위치·상품·수량 | 포장 | 실제 결품 EXC(결품·대체 처리)·고객 처리 |\n| 11 | PPC(피킹·포장센터) 포장 | 유효 PKG(실물 포장 식별자)·라벨·준비완료 | 품질 유지 대기 | 재포장·라벨 재출력 구분 |\n| 12 | 배달 연계 | 준비예정시각·배달 요청 | 기사 도착 | 피킹·포장과 병행 가능 |\n| 13 | 현장·기사 | SHP(출하)·PKG(실물 포장 식별자)·HOV(기사 인계) 전달 확인 | 배송 | 일부만 전달 시 전체 완료 금지 |\n\n매입 PUR(매입확정)·정산 PJA(매입 조정)는 공급사 입고·계약에 연결. 내부 TIN(이송 도착)은 신규 매입이 아님.\n\n## 4. DC(중앙 물류센터) 이관 상세\n```text\nPPC(피킹·포장센터) 보충 수요 → DC(중앙 물류센터) TRF(센터 간 이송) 생성 → SKU(상품 코드)별 로케이션 할당\n→ DC(중앙 물류센터) 집품·목적지 검품 → 출하대기 → 상차·TOUT(이송 출발) → 운송 → PPC(피킹·포장센터) TIN(이송 도착)\n```\n- 공개 B마트 사례: 자동·수동 위치 할당, 취소는 미할당 상태만 가능.\n- 할당된 요청의 취소는 확보 재고·실작업 상태 확인 필요. 해제·회수는 별도 정책.\n- 부분 도착마다 새 TIN(이송 도착). 기존 도착수량 덮어쓰기 금지.\n- 12병 출발·10병 도착이면 2병 잔량 유지·조사. 즉시 폐기하지 않음.\n\n## 5. 바로배달·예약배달 상세\n```text\n바로배달: 주문·출고가능 판단 → 출고요청·준비예정 → 작업·배달 요청 → 인계\n예약배달: 수령시간·예정재고 약속 → 입고 확인·현장 여유·품질 구간\n          → 작업 분산 / 수령시간 맞춘 배달 요청 → 준비·인계\n```\n- 현물 부족만으로 모든 예약 주문을 즉시 거절하지 않음. 예정재고 활용 사례 반영.\n- 예정 물량을 현재 현물에 더하지 않음. 출고 직전 실제 물량 확인.\n- B마트 재고부족 예약 작업 SKIP 사례 반영. 최종 부족 시 취소·연락 규칙은 미확인.\n- 고객 슬롯 판매 상한과 현장 처리 가능량을 구분.\n- 고정 '주문 후 10분' 대신 현장 여건을 반영한 준비시각 산정 사례 참고.\n\n## 6. 피킹 결품·교대\n| 상황 | 프로젝트 흐름 | 미결정 |\n|---|---|---|\n| 피킹 부족 | EXC(결품·대체 처리)·부족수량 → 고객 확인 → 변경 ORD(고객 주문)·OCN(고객 주문 취소)·RFD(환불) | 대체·부분출하·사전 동의 |\n| 연락 불가 | 출하 보류·지원 검토·품질 유지 | 대기시간·자동취소 |\n| 교대·지연 | 완료분·잔여분·실물 토트 → 담당 변경·같은 TSK(작업 식별자) | 강제/수락 방식 |\n| 늦은 스캔 | 권한·담당·작업 상태 재검증 | 충돌 처리 권한 |\n\n## 7. 포장·배차·인계\n```text\n피킹 → 조건별 포장·PKG(실물 포장 식별자) → 라벨·전체 구성 확인 → 준비완료·품질 유지 대기\n                                    배차/배달요청은 준비예정시각 기준 병행\n→ 기사·유효 PKG(실물 포장 식별자) 확인 → 실제 전달 추적 → 전체 전달 시 HOV(기사 인계) 완료\n```\n- 실물 교체: 새 PKG(실물 포장 식별자)·기존 무효·교체 관계. 라벨 재출력: 같은 PKG(실물 포장 식별자).\n- 포장완료·준비완료·인계완료·원장 반영 각각 기록.\n- 차감 시점은 미확정. 선택한 사건으로 한 번만 반영·취소/회수 보정.\n- 일부 전달된 실물은 센터에 있는 것으로 무조건 유지하지 않음. 위치·수령 상태 추적.\n- 상품별 포장·온도·대기한계 등록. 현장 사례 온도를 모든 상품에 적용하지 않음.\n\n## 8. 품질·실사·정산\n| 업무 | 흐름 | 완료 판단 |\n|---|---|---|\n| 품질 | QLT(품질 격리) → 재검수 → 해제/RTV(공급사 반품)/DSP(폐기) | 상태 판정·실제 실행 |\n| 마감할인 | 적합 재고·소비기한·수요 → 할인 대상/수량/율 | 우리 상품 정책 미정 |\n| 실사 | CNT(재고 실사) → 계수·재계수·이동 대조 → ADJ(재고 조정) | 승인 근거·반영 결과 |\n| 매입 | PO(구매발주)·RCV(입고·검수)·계약 → PUR(매입확정) → 확정 후 PJA(매입 조정) | 인정수량·금액·조정 |\n\n- 계약·기한·결재 수치를 임의 기본값으로 넣지 않음.\n- 배송 지연은 품질 점검·보관·시간·안내 조정. 품질 기준 완화로 해결하지 않음.\n\n## 9. 공통 오류·전송\n| 상황 | 처리 |\n|---|---|\n| 조회 결과 없음 | 예정/작업 없음 안내 |\n| 조회 실패 | 실패 표시·재조회 |\n| 오상품·오위치·권한 불일치 | 처리 차단·대상 안내 |\n| 오프라인 | UUID(중복 방지용 고유 요청번호) 임시저장. 최종 확정과 구분 |\n| 응답 유실 | 기존 결과 조회·같은 요청 ID 재전송 |\n| 확정 후 오류 | 원기록 보존·정정/역처리/조정 |\n\n## 10. 관련 정의·구현 순서\n- [채번](00_ERP·WMS%20업무%20문서%20채번%20지침.md), [센터·구역](00_DC_PPC_구역_위치번호_운영웹.md), [정책](12_운영정책_지침안.md), [조사](14_미정정책_쿠팡_B마트_실사례조사.md).\n- 구현안: 기준정보·권한 → PO(구매발주)/ASN(공급사 납품예정)/RCV(입고·검수) → 재고·TRF(센터 간 이송)/TOUT(이송 출발)/TIN(이송 도착) → ORD(고객 주문)/SHP(출하)·작업 → 포장·인계 → 정산·예외 → 예약 분산·할인 고도화.\n- 화면에서 실제 업체 사례와 프로젝트 기능을 구분하되, 상품 사용자에게 내부 구현 설명을 노출할 필요는 없음.\n","12_운영정책_지침안.md":"# 운영정책 — 실사례 우선 정리\n\n## 적용 기준\n- 공개 확인: 공식 자료의 해당 시점·센터·서비스에서 확인된 내용.\n- 프로젝트 규칙: 사용자 채번 지침·원문 업무 요구·구현안. 업체 내부 SOP(표준 업무 절차)와 구분.\n- 정책 미정: 공개되지 않은 금액·비율·시간·승인선. 임의 숫자를 기본값으로 사용하지 않음.\n- [27개 항목 조사](14_미정정책_쿠팡_B마트_실사례조사.md)에서 근거·미확인 범위 확인.\n\n## 1. 로트·채번\n| 구분 | 기준 |\n|---|---|\n| 공개 확인 | B마트 수량·품질·소비기한 검수. Lot 생성·병합 SOP(표준 업무 절차)는 미확인 |\n| 사용자 정의 | 내부 Lot ID·공급사 Lot값 분리. 입고 상품행까지 추적 |\n| 원문 구분안 | 입고일·공급사·상품·소비기한. 실제 업체 기준으로 단정하지 않음 |\n| 미정 | 제조 로트 중심 구분·입고 간 병합·정보 누락 처리 |\n\n- 위치 이동은 제조 Lot정보 변경이 아님.\n- 내부 ID 발급과 품질 적합 판정 구분.\n- 공급사 입고는 RCV(입고·검수), 센터 이송 도착은 TIN(이송 도착) 참조.\n- [문서 채번](00_ERP·WMS%20업무%20문서%20채번%20지침.md)과 [위치주소](00_DC_PPC_구역_위치번호_운영웹.md) 분리.\n\n## 2. 소비기한·품질·마감할인\n| 확인된 운영 | 프로젝트 적용·미정 |\n|---|---|\n| B마트 전담 신선 검품·품질 미달 판매 제외 | 품질 부적합과 기한 임박 구분 |\n| B마트 OMS(주문·출고 관리) 소비기한·수요 기반 마감할인 | 대상·수량·할인율 정책은 별도 결정 |\n| 쿠팡 QC(품질 검사) 검수를 거친 임박상품 마감세일 | 할인·고객 동의가 품질검수 대체하지 않음 |\n\n```text\n검수·기한 확인 → 판매 적합 / 격리 구분 → 재검수·처분 판단 → 승인된 상태 반영\n```\n- 최소 잔여기간·기한 종료시각·격리해제 권한은 상품별 확인 필요.\n- 같은 위치의 복수 로트는 식별·수량 분리. 물리 혼재는 위치 정책으로 결정.\n- 반품 양품화 사례를 냉장·냉동 식품의 재판매 허용 근거로 전용하지 않음.\n\n근거: [B마트 목포 PPC](https://bcut.baemin.com/7369/), [B마트 OMS](https://techblog.woowahan.com/22263/), [쿠팡 마감세일](https://news.coupang.com/archives/21652/).\n\n## 3. 파손·매입 인정\n| 단계 | 프로젝트 처리 |\n|---|---|\n| 검수 | 도착·정상·파손·미납품 구분 |\n| 품질 | 판매 적합성·반품·폐기 판단 |\n| 매입 | 계약·협의에 따라 PUR(매입확정) 인정수량·금액 검토 |\n| 확정 후 조정 | 원 PUR(매입확정) 보존·PJA(매입 조정) 연결 |\n\n- 양사 직매입 파손 허용률·전체 매입 예외는 공개 미확인.\n- 종전 파손 허용 0% 기본값 제거. 계약 미등록은 '조건 미확인'.\n- 품질 부적합과 비용 부담은 별개.\n- 예외 건 자동 지급 확정 보류는 원문 프로젝트 통제안. 실제 지급 SOP(표준 업무 절차)로 단정하지 않음.\n- DC(중앙 물류센터)→PPC(피킹·포장센터) 내부 이송은 동일 상품의 신규 매입으로 중복 반영하지 않음.\n- 위탁형 로켓그로스 약관을 직매입 정산 기준으로 사용하지 않음.\n\n## 4. 사진·폐기 승인\n| 대상 | 기록 | 미정 |\n|---|---|---|\n| 입고 이상 | 문서·상품행·수량·사유·증빙 | 정상 입고 사진 의무·컷 수 |\n| 품질 | QLT(품질 격리)·Lot·검수 근거 | 촬영 조건·보관기간 |\n| 반품·폐기 | RTV(공급사 반품)/DSP(폐기)·승인·실제 실행 | 승인자 수·금액·수량 임계값 |\n| 인계 | HOV(기사 인계)·유효 PKG(실물 포장 식별자)·기사·전달 결과 | 스캔·사진 의무 범위 |\n\n- 공개 근거 없는 10만원·100개 추가 승인값 제거.\n- 승인·실행 분리, 실제 처리 전 현물 유지는 프로젝트 규칙.\n- 결재선·요청자와 승인자 분리 여부는 운영 권한표로 확정.\n- 사진만으로 계수·품질·인계를 확정하지 않음.\n\n## 5. 실사·조정\n공개 확인: 쿠팡 ICQA(재고 수량·품질 점검) 전산기록 모니터링·실물 수량 확인. 잠금 범위·주기·조정 승인값은 미확인.\n\n```text\nCNT(재고 실사) 대상·기준시각 → 계수 → 차이 재확인·변동 대조 → 잔여 차이 ADJ(재고 조정) → 승인·반영\n```\n\n| 선택안 | 적용 조건 — 프로젝트 검토 |\n|---|---|\n| 대상 위치 잠금 | 진행중 이동 정리·입출고 제한 가능 |\n| 운영 중 실사 | 기준시각 이후 변동을 빠짐없이 대조 가능 |\n| 품목별 순환 | 점검 대상·주기 결정 |\n| 전수 실사 | 정기·감사·반복 오차 등 목적별 계획 |\n\n- 실사 방식은 아직 선택안. 업체 기본 SOP(표준 업무 절차)로 표시하지 않음.\n- 차이를 즉시 분실·폐기로 확정하지 않음. 같은 차이의 ADJ(재고 조정)·DSP(폐기) 이중 차감 방지.\n- 계수자·재계수자·승인자·기준시각·변동 근거 기록.\n\n근거: [쿠팡 ICQA](https://news.coupang.com/archives/19934/).\n\n## 6. 결품·고객 무응답\n양사 피킹 결품 대체·부분출하·전화 횟수·무응답 시간의 공개 근거 미확인.\n\n| 단계 | 프로젝트 흐름 | 확인 |\n|---|---|---|\n| 발견 | EXC(결품·대체 처리)·부족수량 기록 | 원주문·대상 행 |\n| 고객 확인 | 취소·대체·전체취소 선택 요청 | 가격·수량·동의 |\n| 연락 불가 | 보류·지원팀 이관 검토 | 대기·보관·사전 동의 정책 |\n| 변경 확정 | ORD(고객 주문)·OCN(고객 주문 취소)·RFD(환불)·예약 갱신 | 처리자·근거·환불 상태 |\n\n- 종전 3분·5분·전화 1회 고정값 제거.\n- 미확정 무응답 자동 취소·임의 대체 실행 금지.\n- 대체상품·알레르기 안내·환불 재산정은 고객 시스템 정책으로 확정.\n- 예약 스케줄의 재고부족 SKIP과 실제 피킹 결품 고객 연락은 별개.\n\n## 7. 출고·차감·기사 인계\n| 사건 | 기록 | 관계 |\n|---|---|---|\n| 예약·할당 | 확보 수량 | 가용과 현물 분리 |\n| 피킹 | 선반·토트·작업 위치 | 내부 이동 |\n| 포장완료 | SHP(출하)·유효 PKG(실물 포장 식별자)·준비시각 | 인계와 별도 |\n| 기사 인계 | HOV(기사 인계)·전달·인수 결과 | 일부·전체 전달 구분 |\n| 원장 차감 | 근거 사건·반영 ID·시각 | 정책 확정 후 한 번만 반영 |\n\n- 양사 실제 차감 이벤트 미확인. 기사 인계 시 차감을 확정 기본값에서 제외.\n- 포장/출고확정 또는 인계 등 선택 시 취소·회수·정정까지 함께 정의.\n- 부분 인계 시 실제 전달분·미전달분 추적. 전체 PKG(실물 포장 식별자) 전달 전 전체 인계완료 금지.\n- 원장 차감시점과 무관하게 실제 공간·전달 상태 기록.\n- 전부 전달 전까지 센터 현물을 무조건 유지하면 부분 인계와 어긋날 수 있음. 자동 적용 금지.\n- 출고 준비와 배차는 병행 가능. 예상 준비시각 활용.\n- TRF(센터 간 이송)·TOUT(이송 출발)·TIN(이송 도착) 이송 및 이동중 수량 규칙은 사용자 문서·재고 설계 유지.\n\n## 8. 예약·작업 용량·대기\n공개 확인: B마트 예약배달·입고예정 판매·출고 부하 분산·동적 준비시각.\n\n```text\n예약 → 현재·예정·할당 재고 확인 → 품질 보존 구간·작업 여유 확인\n→ 출고요청 / 수령시간에 맞춘 배달요청 → 준비완료·인계·배송\n```\n\n| 항목 | 실사례 우선 기준 |\n|---|---|\n| 작업 여유 | 목표생산성·작업가능 인원·현재 출고량 |\n| 요청 분산 | 출고요청·배달요청 분리·품질 보존 구간 |\n| 예정재고 부족 | 우선 SKIP·배송 가능한 마지막 시점에 출고 요청하는 사례 |\n| 라이더 대기 | 현장 여건 기반 출고예정시각 |\n\n- 고객 슬롯 판매 상한과 출고 작업 가능량은 다른 지표.\n- 종전 최소능력×0.8·시간당 고정 건수 공식 제거.\n- 슬롯 상한·접수마감·최대 대기시간·마지막 시점 결품 대응은 미정.\n- 목포 PPC(피킹·포장센터)의 포장 후 냉장 대기는 해당 포장·보냉 사례. 모든 냉동품 보관조건으로 일반화하지 않음.\n\n근거: [B마트 OMS](https://techblog.woowahan.com/22263/), [목포 PPC](https://bcut.baemin.com/7369/).\n\n## 미결정 항목\n| 항목 | 결정 담당·대상 |\n|---|---|\n| Lot | 입고·품질: 구분·병합·누락 |\n| 소비기한 | 품질·상품: 잔여기간·해제·할인 |\n| 파손·매입 | 구매·정산: 계약·비용 부담 |\n| 증빙·폐기 | 운영·품질: 촬영·보관·결재 |\n| 실사 | 센터·재고: 잠금·주기·조정 |\n| 결품 | 지원·운영: 동의·무응답·환불 |\n| 출고·인계 | 물류·재고: 차감·부분인계·회수 |\n| 예약 | 센터·배송: 상한·마감·대기 |\n","14_미정정책_쿠팡_B마트_실사례조사.md":"# 미정 정책 — 쿠팡·B마트 공개 운영 조사\n\n조사일: 2026-10-12, 한국시간.\n대상: `C:\\develoment\\과제\\B마트 사전조사\\03_공급_재고_물류`.\n핵심 검토: 정책 선택을 명시한 5·10·15·19·24·29·35·41·45번 이미지, 총 27개 비교 항목.\n\n## 1. 읽는 기준\n| 표기 | 의미 |\n|---|---|\n| 확인 | 회사 공식 자료에 해당 운영·기능 명시 |\n| 부분 확인 | 관련 기능·사례는 확인. 질문의 세부 규칙은 미확인 |\n| 미확인 | 이번 공개자료 조사에서 근거를 확보하지 못함. 운영하지 않는다는 의미 아님 |\n| 프로젝트 제안 | 우리 프로젝트의 선택안. 업체 실제 정책 아님 |\n\n- 공식 기술블로그·회사 뉴스룸·공개 이용약관을 근거로 사용.\n- 개인 근무 후기·AI 요약·판매대행업체의 설명은 실제 내부 정책 확정 근거에서 제외.\n- 과거 사례는 게시 시점의 운영. 모든 센터·현재 전사 표준으로 확대 해석하지 않음.\n- 쿠팡 직매입 로켓배송, 로켓프레시, 로켓그로스는 구분. 위탁 풀필먼트 약관을 직매입 매입정산 규칙으로 전용하지 않음.\n- 기존 필요 조사·정책 선택 문구는 보존. 본 문서가 조사 보충 자료.\n- [기존 운영정책 지침안](12_운영정책_지침안.md)는 실사례 우선으로 재정리. 과거 임의 수치·시간은 기본 지침에서 제외했으며 업체 실제 값으로 확인되지 않음.\n\n## 2. 먼저 확인된 실제 운영\n| 회사·범위 | 공개 확인 내용 | 근거 |\n|---|---|---|\n| B마트 WMS(창고·재고 관리) |  작업 용량과 고객 슬롯 판매 상한은 별개. 종전 인력·기사 최소값·0.8 계수는 근거가 없어 기본값에서 제거 |\n\n근거: [B마트 OMS 예약·피크 관리](https://techblog.woowahan.com/22263/).\n\n- B마트 공식 글은 출고요청과 배달요청을 분리한 운영을 설명.\n- 정해진 고객 수령시간과 품질을 지키면서 작업 요청을 분산. 내부 최대 대기시간 수치는 공개 글에서 확인되지 않음.\n- '출발 30분 전 피킹'·'시간당 20건'을 B마트 실측 규칙으로 표기하지 않음.\n\n## 보충 확인: B마트 마감할인\n- OMS(주문·출고 관리) 공식 자료에 소비기한·수요 기반 할인 대상·수량·할인율 조정 명시. 우리 최소 기한·율·승인 조건은 미정. [공식 OMS](https://techblog.woowahan.com/22263/)\n\n## 12. 원본에서 보완할 표현\n원본 PNG는 수정하지 않음. 문서·발표에서 사용할 보충 표현 제안.\n\n| 원본 또는 기존 설명 | 조사 후 사용할 표현 |\n|---|---|\n| B마트 예약배송 실제 제공 여부 미확인 | 2025 공식 OMS(주문·출고 관리) 사례에서 예약배달 운영 확인. 현재 지역별 제공·세부 슬롯은 앱 확인 필요 |\n| 이동중 재고는 판매할 수 없음 | 즉시 출고 가능한 현물과 구분. B마트는 입고예정 기반 예약 판매 사례가 있음 |\n| 보충 자동·수동 중 하나 선택 | 공개 확인된 것은 DC(중앙 물류센터) 이관 로케이션 자동·수동 할당. 선반 보충 최소값은 별도 정책 |\n| 출고 = 기사 인계 | 출고 준비·완료·라이더 픽업·재고반영 사건을 분리. 업체 차감시점은 미확인 |\n| 상품 종류별 가까이 모아서 진열 | 목포 PPC(피킹·포장센터)는 무게·주문빈도·패킹 접근 동선 고려. 쿠팡도 계획적 분산 배치 사례 |\n| 입고 검사 하나로 모든 품질 확인 | 서비스별 검수 범위 상이. 신선 품질검수와 위탁 외관·수량 검수 구분 |\n| 품질 기준을 지연 상황에 맞춰 변경 | 공개 근거 없음. 시간·배차·보관 조정과 상품 품질 기준 완화를 구분 |\n\n## 13. 우리 프로젝트에 적용할 결론\n\n### 공개 사례로 근거를 보강할 수 있는 것\n- DC(중앙 물류센터)→PPC(피킹·포장센터) 이관 및 재고 로케이션 할당.\n- 입고 수량·품질·소비기한 검수.\n- 위치·작업·변동 전산 추적과 전담 재고 조사.\n- 피킹 동선·무게·빈도 기반 배치.\n- 품질 미달 판매 제외·임박상품 별도 검수.\n- 예약배달·입고예정 약속·여유 시간 출고 분산.\n- 포장·보냉·출고대기 조건 관리.\n\n### 계속 프로젝트 정책으로 결정할 것\n- 공급사 변경·잔량·초과분 처리 승인·비용.\n- 로트 병합·내부 채번·최소 잔여기한.\n- 파손 매입 허용률·폐기 및 재고조정 결재 기준.\n- 촬영 범위·보관기간·인계 사진 의무.\n- 실사 잠금·주기·재계수 기준.\n- 교대 인계 수락·오프라인 확정 범위.\n- 피킹 결품 대체·부분 출하·무응답 대기시간.\n- 재고원장 차감 시점·최대 대기시간·예약 판매 상한.\n\n## 14. 추가 내부 확인 질문\n| 대상 담당 | 확인할 질문 |\n|---|---|\n| 구매·공급사 | PO(구매발주) 잔량 취소·변경 동의 방식? 파손 소유·비용? 초과 인수 조건? |\n| 입고·품질 | 품목별 검사범위·최소 기한? 인수 전 반송? 촬영 필수 건? |\n| 재고·실사 | 위치 잠금 범위·실사 주기? 재계수·조정 승인 임계값? |\n| 현장 운영 | 자동배정 기준·수동 변경 권한? 교대 토트 인계? 오프라인 허용 기능? |\n| 고객지원 | 대체 사전 동의? 결품 무응답 처리? 부분 출하·쿠폰·환불 재산정? |\n| 출고·배송 | 실제 차감 이벤트? 전체 PKG(실물 포장 식별자) 인계 검증? 예외 사진? 지연·회수 처리? |\n| 예약 운영 | 실제 슬롯·접수마감? 예정재고 약속 실패 대응? 품질 보존 분산 구간? |\n\n## 15. 근거 목록·적용 범위\n| 자료 | 게시일/버전 | 이 조
